programs:
- inputs: [x0, x1, x2]
  outputs: [scaled_dot_product_attention]
  nodes:
  - id: x0
    op: input
    outputs: [[x0, f16, [1, 8, 512, 128]]]
  - id: x1
    op: input
    outputs: [[x1, f16, [1, 8, 512, 128]]]
  - id: x2
    op: input
    outputs: [[x2, f16, [1, 8, 512, 128]]]
  - id: scaled_dot_product_attention
    op: torch.sdpa
    inputs: [x0, x1, x2]
    outputs: [[scaled_dot_product_attention, f16, [1, 8, 512, 128]]]
