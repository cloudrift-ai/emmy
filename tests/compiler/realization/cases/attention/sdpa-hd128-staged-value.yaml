# The same head-dim-128 SDPA as `sdpa-hd128-softmax-v-mma`, with the CHUNKED value channel reading its streamed
# operand from a shared-memory slab instead of gmem-direct.
#
# The chunk tier used to take no transport at all: `TileOp.stage_edges` excluded a chunked view, on the reading that
# the tier "takes its chunk off the TILE, so a transport spelling there would decide nothing". A `STAGE` never
# spelled that chunk — the resolver derives `bk_elems` from `Tile.bk`, the same number — so what the exclusion
# actually decided was that attention's value channel reads gmem-direct. On an RTX 5090 that costs 1.46x on the
# `attention.hd128.softmax_v` golden target: 16.1 us gmem-direct against 11.0 us at `d1/smem-tma`.
#
# The ring is single-buffer by construction (`_chunk_warp_stage` hands back `depth=1`), so this pins `d1`.
