# Causal SDPA over two 64-wide heads, the o_proj over the merged heads, and the residual add, as one kernel: the
# o_proj's A operand is the attention output normalized by its own row sum, a computed cone that reads the softmax
# fold through two edges. With a tensor-core o_proj on the `d2/smem` compute fill, the fill replicated both
# lowerings of that fold per cell and nvcc refused the kernel (`acc3__c3 has already been declared`) on every card;
# the prefill SDPA + o_proj + residual target of the golden-bench corpus had no realizable row for that reason
# (plans/h100-memo-2026-09-10.md, item 5). The seam now lowers the fold once.
