# A CAUSAL head-dim-128 SDPA folded on the tensor cores. SDPA's mask traces as a coordinate `Select` over the
# query row and the key column, added to the score inside the twisted carrier's own prefix, and the chunk tier
# refused the whole target over it twice: the mask's fill / zero constants are a computed operand with no gmem
# address, and the `Select` itself was no straight-line statement. So every masked attention target fell to the
# scalar tier — `attention.hd256.dynM.pv` on the RTX 4090 golden is the recorded row that stopped decoding.
#
# The prefix's leaves are read ONCE ahead of the chunk loop, so they need no slab; the `Select` is per element and
# lands at fragment residence as a `FragmentMask`, the same coordinate substitution the boundary mask
# already performs.
