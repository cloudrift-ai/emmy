# The chunk tier with BOTH of its streamed operands on the slab ring, two slots deep, and its expectation on the
# reduced-accumulate cell. Each of the three is a distinct emission the corpus had no live coverage of: the score's key
# arrives through `_a_smem` beside the value's `_b_smem` and drains N-major with the plain ldmatrix, every slab read
# rides the skeleton's own ring slot rather than a literal 0, and the expectation's mma targets a packed f16 fragment
# whose `FragmentPromote` folds it into the f32 carrier once per chunk. The query is hoisted out of the chunk loop and
# read once per score-K step, which is what the straight-line steps here exist to hold.
#
# Together they are the article's FlashAttention-2 kernel: on an RTX 5090 at the article's own (1, 8, 4096, 64) shape
# the same spelling measures 1.25x eager, against 0.55x before any of them.
