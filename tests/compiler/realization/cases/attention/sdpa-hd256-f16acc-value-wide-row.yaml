# The reduced-accumulate expectation on a register row too wide to hold its partials whole. At head width 256 the
# value product spans the head in one warp column of 32 fragments: the f32 carrier takes 128 registers and the hoisted
# query 64, so 32 live f16 partials (64 more) put the thread past its 255-register envelope. The schedule was refused
# outright, and with the refusal lifted by hand it ran 40.2 us against the f32 cell's 38.1 on an RTX 5090.
#
# The chunk drains one column pair through every key step and folds it at once, so two partials are live instead of
# the row. The pin realizes, the paired ldmatrix loads survive, and the same row measures 38.2 us.
compute_cap:
- 12
- 0
programs:
- inputs: [x0, x1, x2]
  outputs: [scaled_dot_product_attention]
  nodes:
  - id: scaled_dot_product_attention_c3
    op: constant
    attrs:
      name: scaled_dot_product_attention_c3
      value: 0.0
      context_value: null
      load_ops: {__tuple__: []}
      source_path: null
      source_parts: {__tuple__: []}
      source_shape: null
      source_dtype: null
      source_graph: null
    outputs: [[scaled_dot_product_attention_c3, f16, [1]]]
  - id: x0
    op: input
    outputs: [[x0, f16, [1, 16, 512, 256]]]
  - id: x1
    op: input
    outputs: [[x1, f16, [1, 16, 512, 256]]]
  - id: x2
    op: input
    outputs: [[x2, f16, [1, 16, 512, 256]]]
  - id: scaled_dot_product_attention
    op: torch.sdpa
    attrs: {is_causal: true, sliding_window: null, scale: null}
