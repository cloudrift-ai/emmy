# Two Sinkhorn rounds fuse into one kernel whose hoisted row statistics are one cone. That cone passes the
# epsilon constants through beside what it computes, so after the cut the residual piece reads an epsilon from the
# workspace at its root while its nested reduces still read the same constant in place. Both then derive the same
# value under one name, and with the serial row both declarations land in one scope (nvcc: already declared).
# Found on the DeepSeek V4 post-attention Sinkhorn kernel on a V100, where the prior picked such a row.
