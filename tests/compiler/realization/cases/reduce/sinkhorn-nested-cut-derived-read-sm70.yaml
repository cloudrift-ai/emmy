# reduce, take the epsilon from the workspace while a sibling still reads the constant in place. Both derive the
# same value under one name, and the serial row lands both declarations in one scope (nvcc: already declared).
# Kernel lowering re-spells such a pair only where a root joins its own statements, which this reader is not.
# Found on the DeepSeek V4 post-attention Sinkhorn kernel on a V100, where the prior picked such a row.
