# The input spells reciprocal then multiply explicitly to retain this regression after division normalization was removed.
# Six Sinkhorn half-rounds that share one epsilon, in the order row, column, column, row, row, column: no two steps
# alike, so the recurrence roller leaves them unrolled and fusion keeps one kernel that recomputes each statistic
# under its reduces. The cut's nested cone passes the epsilon through beside its statistic. Its reader, under a
# reduce, then takes the epsilon from the workspace while a sibling still reads the constant in place; both derive
# the same value, and without the rename that follows a workspace read into what is derived from it they would share
# one name (nvcc: already declared). Kernel lowering re-spells such a pair positionally, which also moves the piece
# identities this case pins, so the case fails at `realized` if the cut stops renaming.
# Found on the DeepSeek V4 post-attention Sinkhorn kernel on a V100, where the prior picked such a row.
