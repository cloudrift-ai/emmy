loops:
- inputs: [x]
  outputs: [rms_norm]
  nodes:
  - id: p_weight
    op: constant
    attrs: {name: p_weight, source_path: weight, source_shape: [4096], source_dtype: float32}
    outputs: [[p_weight, f32, [4096]]]
  - id: rms_norm_eps
    op: constant
    attrs: {name: rms_norm_eps, value: 1.0e-06}
    outputs: [[rms_norm_eps, f32, [1]]]
  - id: rms_norm_mean_count
    op: constant
    attrs: {name: rms_norm_mean_count, value: 4096.0}
    outputs: [[rms_norm_mean_count, f32, [1]]]
  - id: x
    op: input
    outputs: [[x, f32, [512, 4096]]]
  - id: rms_norm
    op: loop
    attrs:
      body:
      - Load: {names: [in0], input: rms_norm_eps, index: [{literal: {value: 0, dtype: int}}], dtype: null}
      - Load: {names: [in1], input: rms_norm_mean_count, index: [{literal: {value: 0, dtype: int}}], dtype: null}
      - Loop:
          axis: {name: a0, extent: 512}
          body:
          - Loop:
              axis: {name: a1, extent: 4096}
              body:
              - {Load: {names: [in2], input: x, index: [{var: a0}, {var: a1}], dtype: null}}
              - {Assign: {name: v0, op: multiply, args: [in2, in2]}}
              - {Accum: {name: acc0, value: v0, axes: [a1]}}
          - {Assign: {name: v1, op: divide, args: [acc0, in1]}}
          - {Assign: {name: v2, op: add, args: [in0, v1]}}
          - {Assign: {name: v3, op: rsqrt, args: [v2]}}
          - Loop:
              axis: {name: a2, extent: 4096}
              body:
              - {Load: {names: [in3], input: x, index: [{var: a0}, {var: a2}], dtype: null}}
              - {Assign: {name: v4, op: multiply, args: [in3, v3]}}
              - {Load: {names: [in4], input: p_weight, index: [{var: a2}], dtype: null}}
              - {Assign: {name: v5, op: multiply, args: [in4, v4]}}
              - Write:
                  output: rms_norm
                  index:
                  - {var: a0}
                  - {var: a2}
                  values:
                  - v5
                  value_dtype: null
                  atomic: false
                  swizzle: NONE
      name: k_rms_norm_7f9133
    inputs: [rms_norm_mean_count, rms_norm_eps, x, p_weight]
    outputs: [[rms_norm, f32, [512, 4096]]]
