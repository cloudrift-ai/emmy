# evidence: The exact Qwen3 c3d placement child built the same f32-accumulator times f16-scale
# expression on A100 with an explicit conversion, and sm120 offers and realizes this reduced
# REDUCE=coop, WORK=t32 schedule before nvcc rejects only the emitted mixed-dtype expression.
compute_cap:
- 12
- 0
programs:
- inputs: [x, scale, bias]
  outputs: [out]
  nodes:
  - id: bias
    op: input
    outputs: [[bias, f32, [4, 1]]]
  - id: scale
    op: input
    outputs: [[scale, f16, [4, 1]]]
  - id: x
    op: input
    outputs: [[x, f16, [4, 128]]]
  - id: sum
    op: tensor.reduce
    attrs: {axis: 1}
    inputs: [x]
    outputs: [[sum, f32, [4, 1]]]
  - id: mul
    op: tensor.elementwise
    attrs: {op: multiply}
    inputs: [sum, scale]
    outputs: [[mul, f32, [4, 1]]]
  - id: out
    op: tensor.elementwise
    attrs: {op: add}
    inputs: [bias, mul]
    outputs: [[out, f32, [4, 1]]]
configs:
- program: 0
  target:
    loop: 0
    origins:
    - mul
    - out
    - sum
  realizations:
  - name: k_out_reduce
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      REDUCE: coop
      WORK: t32
    identity: 8bdbc257be65ba44fbb0794a1593e668484cc4020d320bad35280a48444ca4b1
loops:
- inputs: [bias, scale, x]
  outputs: [out]
  nodes:
  - id: bias
    op: input
    outputs: [[bias, f32, [4, 1]]]
  - id: scale
    op: input
    outputs: [[scale, f16, [4, 1]]]
  - id: x
    op: input
    outputs: [[x, f16, [4, 128]]]
  - id: out
    op: loop
    attrs:
      body:
      - Loop:
          axis: {name: a0, extent: 4}
          body:
          - Loop:
              axis: {name: a1, extent: 128}
              body:
              - {Load: {names: [in0], input: x, index: [{var: a0}, {var: a1}], dtype: null}}
              - {Accum: {name: acc0, value: in0, axes: [a1]}}
          - Load: {names: [in1], input: bias, index: [{var: a0}, {literal: {value: 0, dtype: int}}], dtype: null}
          - Load: {names: [in2], input: scale, index: [{var: a0}, {literal: {value: 0, dtype: int}}], dtype: null}
          - {Assign: {name: v0, op: multiply, args: [acc0, in2]}}
          - {Assign: {name: v1, op: add, args: [in1, v0]}}
          - Write:
              output: out
              index:
              - {var: a0}
              - {literal: {value: 0, dtype: int}}
              values:
              - v1
              value_dtype: null
              atomic: false
              swizzle: NONE
      name: k_out_reduce
    inputs: [x, scale, bias]
    outputs: [[out, f32, [4, 1]]]
