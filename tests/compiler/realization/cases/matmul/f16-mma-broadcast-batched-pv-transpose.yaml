- inputs: [x0, x1]
  outputs: [transpose]
  nodes:
  - id: transpose_c1
    op: constant
    attrs: {name: transpose_c1, value: -1.0}
    outputs: [[transpose_c1, f16, [1]]]
  - id: transpose_c2
    op: constant
    attrs: {name: transpose_c2, value: -2.0}
    outputs: [[transpose_c2, f16, [1]]]
  - id: x0
    op: input
    outputs: [[x0, f16, [1, 512, 1024]]]
  - id: x1
    op: input
    outputs: [[x1, f16, [8, 1024, 128]]]
  - id: matmul
    op: torch.matmul
    inputs: [x0, x1]
    outputs: [[matmul, f16, [8, 512, 128]]]
  - id: transpose
    op: torch.transpose
    attrs: {axes: [-1, -2]}
    inputs: [matmul]
    outputs: [[transpose, f16, [8, 128, 512]]]
