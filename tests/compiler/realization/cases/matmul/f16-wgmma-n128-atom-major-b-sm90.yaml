# An f16 128x128x128 matmul whose N-contiguous B is two swizzle atoms wide, on the Hopper warp-group tier:
# eight warps (two warp groups) stack along M, one m64n128k16 instruction spans the sixteen accumulator cells,
# K arrives in 64-element chunks through a two-slot TMA ring. The B slab is atom-major (each 64-column atom its
# own 64 K rows, one TMA box per atom), which is the MN-major canonical layout the descriptor reads; the
# row-major deposit put every element of this row wrong on the H100 (2026-09-10, plans/hopper-wgmma.md).
