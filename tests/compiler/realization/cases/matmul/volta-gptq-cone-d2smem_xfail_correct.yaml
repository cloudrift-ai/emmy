# evidence: the two schedules one knob away from this one both realize, build and run CORRECTLY on
# the same kernel, the same program and the same card. `WORK=w2x2 TILE=mma_m8n8k4_f16_f32/f4x4/k8
# STAGE=d2/smem` is clean at 849 us, and `WORK=w2x2 TILE=mma_m8n8k4_f16_f32/f2x2/k8 STAGE=d1/smem`
# is clean at 1277 us. So the Volta atom, the w2x2 warp grid, the f2x2/k8 fragment and depth-2 smem
# staging are each individually fine here; only their conjunction is wrong. A schedule whose every
# one-knob neighbour is correct should itself be correct.
#
# The gap: this row compiles, launches, completes, and returns garbage. Measured against eager at
# rtol=atol=1e-3, 2,145,034 of 2,621,440 output elements are outside tolerance -- 82% of the result
# -- while both neighbours above pass strictly. It is not a tolerance question: a `--strict` run
# reports the two neighbours clean and only this row failing.
#
# Why it is a `correct` xfail and not `built`: nvcc accepts the kernel and it runs at a perfectly
# plausible 1,153 us, faster than the correct d1/smem neighbour. Nothing about the launch or the
# timing distinguishes it. That is what makes it dangerous -- a recorded row carrying this schedule
# would deploy and silently produce wrong numbers, and only an output comparison catches it.
#
# Where it came from: found while tuning Qwen3.8-27B-GPTQ-Int4 on a Tesla V100 (sm_70), on the real
# `in_proj_qkv` linear with its packed-int4 decode cone fused in, where it measured rel err 2.177
# and 2.193 against the greedy output on two runs and 88% of elements outside 1e-3 against eager.
# The AWQ slot reproduced the same fragment independently on a different kernel in a different
# quantization (rel err 1.614) where `f4x4/k8` agreed, so it is neither model- nor
# coding-specific. This case is the minimized form: a one-layer synthetic GPTQ checkpoint driven
# through the real `spell_quantized_constants`, which is what builds the cone.
#
# The cone is load-bearing and that is the sharpest clue about the mechanism. `STAGE=d2/smem` is not
# offered at all on a plain f16 contraction of the same shape, nor on a decode cone written as a
# traced expression -- only on one built from checkpoint-backed constants, whose buffers carry
# `source_path` / `load_ops`. Depth-2 staging appears to require a loaded operand it has something
# to prefetch from. The failing configuration is also the only one landing on a 12 KB
# double-buffered allocation (its correct neighbours are 8 KB single-buffered at the same warp grid
# and fragment, and 24 KB at the same depth), which points at a second-buffer offset or a barrier in
# the staging drain rather than at the mma lowering. Not proven: no SASS or ncu inspection was done,
# and it should not be upgraded from a hypothesis without that.
