# Volta's mma tier on a model-sized f16 projection. This shape's warp rows were once
# unreachable — every proposed mma_m8n8k4 row on a Laguna k_linear twin reported
# pin_unmatched while the same family was the measured winner on another model's sm_70
# golden at a neighbouring shape. The lockout is closed; this case is the ratchet that
# keeps it closed, and it runs its enumeration and lowering stages on any box, because
# a case is replayed at its DECLARED capability rather than the live card's.
compute_cap:
- 7
- 0
programs:
- inputs: [x, w]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [12288, 3072]]]
  - id: x
    op: input
    outputs: [[x, f16, [1024, 3072]]]
  - id: o
    op: torch.linear
    inputs: [x, w]
    outputs: [[o, f16, [1024, 12288]]]
configs:
- program: 0
  target:
    loop: 0
    origins:
    - o
  realizations:
  - name: k_linear_3dbf1d
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      WORK: w4x2
      TILE: mma_m8n8k4_f16_f32/f2x2/k8
      STAGE: d1/smem
      REDUCE: ''
    identity: 8667422a58fd99337f9b8f4c245be2b767b0ac2d43422e74771323e89a8bd521
loops:
- inputs: [w, x]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [12288, 3072]]]
  - id: x
    op: input
    outputs: [[x, f16, [1024, 3072]]]
  - id: o
    op: loop
    attrs:
      body:
      - Loop:
          axis: {name: a0, extent: 1024}
          body:
          - Loop:
              axis: {name: a1, extent: 12288}
              body:
              - Loop:
                  axis: {name: a2, extent: 3072}
                  body:
                  - {Load: {names: [in0], input: w, index: [{var: a1}, {var: a2}], dtype: null}}
                  - {Load: {names: [in1], input: x, index: [{var: a0}, {var: a2}], dtype: null}}
                  - {Assign: {name: v0, op: multiply, args: [in0, in1], dtype: f32}}
                  - {Accum: {name: acc0, value: v0, axes: [a2]}}
              - Write:
                  output: o
                  index:
                  - {var: a0}
                  - {var: a1}
                  values:
                  - acc0
                  value_dtype: null
                  atomic: false
                  swizzle: NONE
      name: k_linear_c636b8
    inputs: [w, x]
    outputs: [[o, f16, [1024, 12288]]]
