# An f16 128x128x64 matmul on the Hopper warp-group tier: eight warps (two warp groups) stack along M, one
# m64n64k16 instruction per warp row spans the eight 16x8 accumulator cells, K arrives in 64-element chunks
# through a two-slot TMA ring. Both operands are read through shared-memory matrix descriptors.
# evidence: the corpus's sm_120 f16-mma-*-tma cases realize the same TMA ring under mma.sync; the descriptor
# layout is the 128-byte swizzle the ring already deposits (plans/hopper-wgmma.md, "Where things stand").
compute_cap:
- 9
- 0
programs:
- inputs: [x0, x1]
  outputs: [matmul]
  nodes:
  - id: x0
    op: input
    outputs: [[x0, f16, [128, 128]]]
  - id: x1
    op: input
    outputs: [[x1, f16, [128, 64]]]
  - id: matmul
    op: torch.matmul
    inputs: [x0, x1]
    outputs: [[matmul, f16, [128, 64]]]
configs:
- program: 0
  target:
    loop: 0
    origins:
    - matmul
  realizations:
  - name: k_matmul_df52fc
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      WORK: w8x1
      TILE: wgmma_m64n64k16_f16_f32/f1x8/k4
      REDUCE: ''
      STAGE: d2/smem-tma
      RASTER: ''
    identity: 0effb1a56ce2cc6186d0f065a3a18d10001b5aabf5d623fcd5eb4b86d0c75fc5
loops:
- inputs: [x0, x1]
  outputs: [matmul]
  nodes:
  - id: x0
    op: input
    outputs: [[x0, f16, [128, 128]]]
  - id: x1
    op: input
    outputs: [[x1, f16, [128, 64]]]
  - id: matmul
    op: loop
    attrs:
      body:
      - Loop:
          axis: {name: a0, extent: 128}
          body:
          - Loop:
              axis: {name: a1, extent: 64}
              body:
              - Loop:
                  axis: {name: a2, extent: 128}
                  body:
                  - {Load: {names: [in0], input: x0, index: [{var: a0}, {var: a2}], dtype: null}}
                  - {Load: {names: [in1], input: x1, index: [{var: a2}, {var: a1}], dtype: null}}
                  - {Assign: {name: v0, op: multiply, args: [in0, in1], dtype: f32}}
                  - {Accum: {name: acc0, value: v0, axes: [a2]}}
              - Write:
                  output: matmul
                  index:
                  - {var: a0}
                  - {var: a1}
                  values:
                  - acc0
                  value_dtype: null
                  atomic: false
                  swizzle: NONE
      name: k_matmul_442d08
    inputs: [x1, x0]
    outputs: [[matmul, f16, [128, 64]]]
