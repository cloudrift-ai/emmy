# An f16 128x128x64 matmul on the Hopper warp-group tier: eight warps (two warp groups) stack along M, one
# m64n64k16 instruction per warp row spans the eight 16x8 accumulator cells, K arrives in 64-element chunks
# through a two-slot TMA ring. Both operands are read through shared-memory matrix descriptors.
# evidence: the corpus's sm_120 f16-mma-*-tma cases realize the same TMA ring under mma.sync; the descriptor
# layout is the 128-byte swizzle the ring already deposits (plans/hopper-wgmma.md, "Where things stand").
compute_cap:
- 9
- 0
programs:
- inputs: [x0, x1]
  outputs: [matmul]
  nodes:
  - id: x0
    op: input
    outputs: [[x0, f16, [128, 128]]]
  - id: x1
    op: input
    outputs: [[x1, f16, [128, 64]]]
  - id: matmul
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [x0, x1]
    outputs: [[matmul, f16, [128, 64]]]
configs:
- program: 0
  target:
    loop: 0
    origins:
    - matmul
  realizations:
  - name: k_matmul_df52fc
