# The W4A4 linear as `--ir cuda` renders it: a packed-pair (NVFP4) weight and activation staged as
# raw byte slabs, drained by the block-scaled tensor-core cell, with the per-fragment statement runs
# re-rolled into `#pragma unroll` loops (`LOOPIFY`, the readability policy `emmy compile` turns on).
# Re-rolling arrays a fragment family under one declaration, so its members are addressed
# subscripted (`_b[_r0]`) rather than by a name of their own. Two things then hang off the family
# instead of the reference: the fragment's dtype, whose readers all fall back silently, and the
# declared shape, which a family of scalar registers (the block scales) has to keep. This is the
# only schedule where either can be lost, and both cost the packed slab its meaning -- one stored
# byte read as one K value where it holds two.
#
# `LOOPIFY` rides in `pins` because it is an input regime rather than a schedule row: it re-spells
# the emitted source and leaves the SASS alone, so no `TILE` / `WORK` / `STAGE` value can express
# it. The target is the exact Loop program rather than the frontend one, because the checkpoint's
# e2m1 value table reaches the graph as a constant with no inline value, which the numpy twin
# cannot supply -- the same reason the fused NVFP4 case takes a Loop target.
compute_cap: [12, 0]
programs:
- inputs: [input]
  outputs: [linear]
  nodes:
  - id: input
    op: input
    outputs: [[input, f32, [128, 512]]]
  - id: input_static_fp4_blk
    op: torch.reshape
    attrs: {shape: [128, 32, 16]}
    inputs: [input]
    outputs: [[input_static_fp4_blk, f32, [128, 32, 16]]]
  - id: input_static_fp4_abs
    op: tensor.elementwise
    attrs: {op: abs}
    inputs: [input_static_fp4_blk]
    outputs: [[input_static_fp4_abs, f32, [128, 32, 16]]]
  - id: input_static_fp4_amax
    op: tensor.reduce
    attrs: {op: maximum, axis: -1}
    inputs: [input_static_fp4_abs]
    outputs: [[input_static_fp4_amax, f32, [128, 32, 1]]]
  - id: input_static_fp4_f4_max
    op: constant
    attrs: {name: input_static_fp4_f4_max, value: 6.0}
    outputs: [[input_static_fp4_f4_max, f32, [1]]]
  - id: input_static_fp4_f4_max_bc
    op: tensor.index_map
    attrs: {out_shape: [128, 32, 1], sources: [{input_idx: 0, coord_map: [{var: out_coord_2}]}]}
    inputs: [input_static_fp4_f4_max]
    outputs: [[input_static_fp4_f4_max_bc, f32, [128, 32, 1]]]
  - id: input_static_fp4_floor
    op: constant
    attrs: {name: input_static_fp4_floor, value: 1.0e-12}
    outputs: [[input_static_fp4_floor, f32, [1]]]
  - id: input_static_fp4_floor_bc
    op: tensor.index_map
    attrs: {out_shape: [128, 32, 1], sources: [{input_idx: 0, coord_map: [{var: out_coord_2}]}]}
    inputs: [input_static_fp4_floor]
    outputs: [[input_static_fp4_floor_bc, f32, [128, 32, 1]]]
  - id: input_static_fp4_r1_f4_pairs
    op: constant
    attrs:
      name: input_static_fp4_r1_f4_pairs
      source_shape:
      - 256
      - 2
      source_dtype: f32
      source_graph:
        inputs: []
        outputs: [pairs]
        nodes:
        - id: codes
          op: tensor.range
          attrs: {stop: 256, dtype: i32}
          outputs: [[codes, i32, [256]]]
        - id: mask
          op: constant
          attrs: {name: mask, value: 15}
          outputs: [[mask, i32, [1]]]
        - id: mask_bc
          op: tensor.index_map
          attrs: {out_shape: [256], sources: [{input_idx: 0, coord_map: [{literal: 0}]}]}
          inputs: [mask]
          outputs: [[mask_bc, i32, [256]]]
        - id: low
          op: tensor.elementwise
          attrs: {op: bitwise_and}
          inputs: [codes, mask_bc]
          outputs: [[low, i32, [256]]]
        - id: shift
          op: constant
          attrs: {name: shift, value: 4}
          outputs: [[shift, i32, [1]]]
        - id: shift_bc
          op: tensor.index_map
          attrs: {out_shape: [256], sources: [{input_idx: 0, coord_map: [{literal: 0}]}]}
          inputs: [shift]
          outputs: [[shift_bc, i32, [256]]]
        - id: high
          op: tensor.elementwise
          attrs: {op: right_shift}
          inputs: [codes, shift_bc]
          outputs: [[high, i32, [256]]]
        - id: vhigh
          op: tensor.elementwise
          attrs: {op: from_f4e2m1}
          inputs: [high]
          outputs: [[vhigh, f32, [256]]]
        - id: vlow
          op: tensor.elementwise
          attrs: {op: from_f4e2m1}
          inputs: [low]
          outputs: [[vlow, f32, [256]]]
        - id: pairs
          op: tensor.index_map
          attrs:
            out_shape:
            - 256
            - 2
            sources:
            - input_idx: 0
              coord_map:
              - {var: out_coord_0}
              select: {binary: {op: <, left: {var: out_coord_1}, right: {literal: 1}}}
            - {input_idx: 1, coord_map: [{var: out_coord_0}]}
          inputs: [vlow, vhigh]
          outputs: [[pairs, f32, [256, 2]]]
    outputs: [[input_static_fp4_r1_f4_pairs, f32, [256, 2]]]
  - id: input_static_fp4_scale_2
    op: constant
    attrs:
      name: input_static_fp4_scale_2
      load_ops:
      - {torch.reshape: {shape: [1, 1, 1]}}
      source_path: l0.input_scale
      source_shape: []
      source_dtype: f32
    outputs: [[input_static_fp4_scale_2, f32, [1, 1, 1]]]
  - id: input_static_fp4_scale_2_bc
    op: tensor.index_map
    attrs:
      out_shape:
      - 128
      - 32
      - 1
      sources:
      - {input_idx: 0, coord_map: [{literal: 0}, {literal: 0}, {var: out_coord_2}]}
    inputs: [input_static_fp4_scale_2]
    outputs: [[input_static_fp4_scale_2_bc, f32, [128, 32, 1]]]
  - id: input_static_fp4_denom
    op: tensor.elementwise
    attrs: {op: multiply}
    inputs: [input_static_fp4_f4_max_bc, input_static_fp4_scale_2_bc]
    outputs: [[input_static_fp4_denom, f32, [128, 32, 1]]]
  - id: input_static_fp4_ratio
    op: tensor.elementwise
    attrs: {op: divide}
    inputs: [input_static_fp4_amax, input_static_fp4_denom]
    outputs: [[input_static_fp4_ratio, f32, [128, 32, 1]]]
  - id: input_static_fp4_scale_bits
    op: tensor.elementwise
    attrs: {op: to_f8e4m3}
    inputs: [input_static_fp4_ratio]
    outputs: [[input_static_fp4_scale_bits, f8e4m3, [128, 32, 1]]]
  - id: input_static_fp4_r1_scale_vals
    op: tensor.elementwise
    attrs: {op: from_f8e4m3}
    inputs: [input_static_fp4_scale_bits]
    outputs: [[input_static_fp4_r1_scale_vals, f32, [128, 32, 1]]]
  - id: input_static_fp4_scale_vals
