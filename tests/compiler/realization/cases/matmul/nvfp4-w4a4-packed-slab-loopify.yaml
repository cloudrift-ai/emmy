    outputs: [[input_static_fp4_scale_vals, f32, [128, 32, 1]]]
  - id: input_static_fp4_fused32
    op: tensor.elementwise
    attrs: {op: multiply}
    inputs: [input_static_fp4_scale_vals, input_static_fp4_scale_2_bc]
    outputs: [[input_static_fp4_fused32, f32, [128, 32, 1]]]
  - id: input_static_fp4_fused
    op: tensor.elementwise
    inputs: [input_static_fp4_fused32]
    outputs: [[input_static_fp4_fused, f16, [128, 32, 1]]]
  - id: input_static_fp4_div32
    op: tensor.elementwise
    inputs: [input_static_fp4_fused]
    outputs: [[input_static_fp4_div32, f32, [128, 32, 1]]]
  - id: input_static_fp4_safe
    op: tensor.elementwise
    attrs: {op: maximum}
    inputs: [input_static_fp4_div32, input_static_fp4_floor_bc]
    outputs: [[input_static_fp4_safe, f32, [128, 32, 1]]]
  - id: input_static_fp4_safe_bc
    op: tensor.index_map
    attrs:
      out_shape:
      - 128
      - 32
      - 16
      sources:
      - {input_idx: 0, coord_map: [{var: out_coord_0}, {var: out_coord_1}, {literal: 0}]}
    inputs: [input_static_fp4_safe]
    outputs: [[input_static_fp4_safe_bc, f32, [128, 32, 16]]]
  - id: input_static_fp4_norm
    op: tensor.elementwise
    attrs: {op: divide}
    inputs: [input_static_fp4_blk, input_static_fp4_safe_bc]
    outputs: [[input_static_fp4_norm, f32, [128, 32, 16]]]
  - id: input_static_fp4_codes
    op: tensor.elementwise
    attrs: {op: to_f4e2m1}
    inputs: [input_static_fp4_norm]
    outputs: [[input_static_fp4_codes, i32, [128, 32, 16]]]
  - id: input_static_fp4_codes_flat
    op: torch.reshape
    attrs: {shape: [128, 512]}
    inputs: [input_static_fp4_codes]
    outputs: [[input_static_fp4_codes_flat, i32, [128, 512]]]
  - id: input_static_fp4_even
    op: tensor.index_map
    attrs:
      out_shape:
      - 128
      - 256
      sources:
      - input_idx: 0
        coord_map:
        - {var: out_coord_0}
        - {binary: {op: '*', left: {var: out_coord_1}, right: {literal: 2}}}
    inputs: [input_static_fp4_codes_flat]
    outputs: [[input_static_fp4_even, i32, [128, 256]]]
  - id: input_static_fp4_odd
    op: tensor.index_map
    attrs:
      out_shape:
      - 128
      - 256
      sources:
      - input_idx: 0
        coord_map:
        - {var: out_coord_0}
        - binary:
            op: +
            left: {binary: {op: '*', left: {var: out_coord_1}, right: {literal: 2}}}
            right: {literal: 1}
    inputs: [input_static_fp4_codes_flat]
    outputs: [[input_static_fp4_odd, i32, [128, 256]]]
  - id: input_static_fp4_shift
    op: constant
    attrs: {name: input_static_fp4_shift, value: 4}
    outputs: [[input_static_fp4_shift, i32, [1]]]
  - id: input_static_fp4_shift_bc
