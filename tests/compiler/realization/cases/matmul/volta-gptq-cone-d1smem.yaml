# synthetic checkpoint through the real `spell_quantized_constants` (the checkpoint-backed
# constants are what offer the staged fill here; a traced decode expression does not).
#
# The fill stages at depth 1. Depth 2 is the B-only prefetch ring, and with no cp.async on sm_70
# its B copies are blocking copies: on a Tesla V100 it returned silently wrong answers on nine of
# sixteen warp grids and fragments of the Qwen3.8-27B-GPTQ-Int4 `in_proj_qkv` linear (rel err 0.08
# to 2.5, faster than depth 1, so nothing but an output comparison caught it), while depth 1 was
# correct on all sixteen. The compiler no longer offers depth 2 on this atom;
# `test_volta_compute_fill_offers_no_prefetch_ring` holds that refusal on this program.
