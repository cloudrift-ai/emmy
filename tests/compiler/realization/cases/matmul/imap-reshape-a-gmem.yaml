# A layout op between an activation and its matmul is absorbed into the operand's load index,
# so the operand is no longer a plain window of its buffer. The gmem-direct mma fragment loader
# steps rows by one leading dimension, and it reads that dimension off the operand's FLAT address:
# the index spells the split row as `[m / 2, (m % 2) * 128 + k]`, which sums to `128·m + k`.
# Taking the buffer's declared trailing extent instead read a rectangle of the wrong buffer,
# silently, on plain f16.
#
# A's rows re-strided to 128 against a declared trailing extent of 256, read gmem-direct.
compute_cap:
- 12
- 0
programs:
- inputs: [x, w]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [128, 64]]]
  - id: x
    op: input
    outputs: [[x, f16, [128, 256]]]
  - id: xr
    op: torch.reshape
    attrs: {shape: {__tuple__: [256, 128]}}
    inputs: [x]
    outputs: [[xr, f16, [256, 128]]]
  - id: o
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [xr, w]
    outputs: [[o, f16, [256, 64]]]
configs:
- program: 0
  target:
    loop: 0
    origins:
    - o
    - xr
  realizations:
  - name: k_matmul_99a64f
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      WORK: w1x4
      TILE: mma_m16n8k16_f16_f32/f4x1/k4
      REDUCE: ''
      STAGE: ''
      RASTER: ''
    identity: b2ba71b48b9b850b813b87f19e95b69eefa4a49300e82b779abc500a48738c02
loops:
- inputs: [w, x]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [128, 64]]]
  - id: x
    op: input
    outputs: [[x, f16, [128, 256]]]
  - id: o
    op: loop
    attrs:
      body:
        body:
        - class: Loop
          fields:
            axis: {class: Axis, fields: {name: a0, extent: {dim: 256}, window: null}}
            body:
              body:
              - class: Loop
                fields:
                  axis: {class: Axis, fields: {name: a1, extent: {dim: 64}, window: null}}
                  body:
                    body:
                    - class: Loop
                      fields:
                        axis: {class: Axis, fields: {name: a2, extent: {dim: 128}, window: null}}
                        body:
                          body:
                          - class: Load
                            fields:
                              names: {tuple: [in0]}
                              input: x
                              index:
                                tuple:
                                - {expr: {binary: {op: /, left: {var: a0}, right: {literal: {value: 2, dtype: int}}}}}
                                - expr:
                                    binary:
                                      op: +
                                      left:
                                        binary:
                                          op: '*'
                                          left: {binary: {op: '%', left: {var: a0}, right: {literal: {value: 2, dtype: int}}}}
                                          right: {literal: {value: 128, dtype: int}}
                                      right: {var: a2}
                              dtype: null
                          - class: Load
                            fields:
                              names: {tuple: [in1]}
                              input: w
                              index: {tuple: [{expr: {var: a2}}, {expr: {var: a1}}]}
                              dtype: null
                          - class: Assign
                            fields: {name: v0, op: {elementwise: multiply}, args: {tuple: [in0, in1]}, dtype: {dtype: f32}}
                          - class: Accum
                            fields: {name: acc0, value: v0, op: {elementwise: add}, dtype: null, axes: {tuple: [a2]}, base: null}
                        unroll: false
                        seed: true
                    - class: Write
                      fields:
                        output: o
                        index: {tuple: [{expr: {var: a0}}, {expr: {var: a1}}]}
                        values: {tuple: [acc0]}
                        value_dtype: null
                        atomic: false
                        swizzle: NONE
                  unroll: false
                  seed: true
            unroll: false
            seed: true
      name: k_matmul_3c6f85
    inputs: [x, w]
