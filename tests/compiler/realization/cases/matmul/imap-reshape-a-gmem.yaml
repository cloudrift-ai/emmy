# A layout op between an activation and its matmul is absorbed into the operand's load index,
# so the operand is no longer a plain window of its buffer. The gmem-direct mma fragment loader
# steps rows by one leading dimension, and it reads that dimension off the operand's FLAT address:
# the index spells the split row as `[m / 2, (m % 2) * 128 + k]`, which sums to `128·m + k`.
# Taking the buffer's declared trailing extent instead read a rectangle of the wrong buffer,
# silently, on plain f16.
#
# A's rows re-strided to 128 against a declared trailing extent of 256, read gmem-direct.
compute_cap: [12, 0]
programs:
- inputs: [x, w]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [128, 64]]]
  - id: x
    op: input
    outputs: [[x, f16, [128, 256]]]
  - id: xr
    op: torch.reshape
    attrs: {shape: [256, 128]}
    inputs: [x]
    outputs: [[xr, f16, [256, 128]]]
  - id: o
    op: torch.matmul
    inputs: [xr, w]
    outputs: [[o, f16, [256, 64]]]
configs:
- program: 0
  target: {loop: 0, origins: [o, xr]}
  realizations:
  - name: k_matmul_99a64f
    pins: {FAST_MATH: false}
    knobs:
      WORK: w1x4
      TILE: mma_m16n8k16_f16_f32/f4x1/k4
      REDUCE: ''
      STAGE: ''
      RASTER: ''
    identity: 469fca02357acb0dad02401b18b20ec243896cc65e7f9240c64202cc86f1d178
loops:
- inputs: [w, x]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [128, 64]]]
  - id: x
    op: input
    outputs: [[x, f16, [128, 256]]]
  - id: o
    op: loop
    attrs:
      body:
      - Loop:
          axis: {name: a0, extent: 256}
          body:
          - Loop:
              axis: {name: a1, extent: 64}
              body:
              - Loop:
                  axis: {name: a2, extent: 128}
                  body:
                  - {Load: {names: [in0], input: x, index: [a0 // 2, a0 % 2 * 128 + a2]}}
                  - {Load: {names: [in1], input: w, index: [a2, a1]}}
                  - {Assign: {name: v0, op: multiply, args: [in0, in1], dtype: f32}}
                  - {Accum: {name: acc0, value: v0, axes: [a2]}}
              - {Write: {output: o, index: [a0, a1], values: [acc0]}}
      name: k_matmul_7d81a2
    inputs: [w, x]
    outputs: [[o, f16, [256, 64]]]
