# The serving W4A4 MLP shape: gate + up + SiLU + the NVFP4 re-encode of their product, the one
# fused kernel a coded-trunk decode step spends most of its time in. The encode emits two outputs
# at two extents — packed codes over the feature axis and one e4m3 block scale per 16 of them — so
# the free-axis peel keeps only the token axis, the two outputs hang off the root term as their own
# branches, and every contraction sits below one of them. There the grid supplies no (m, n) pair,
# and the tensor-core tier that the same gate+up tree takes without the encode
# (gate-up-shared-a.yaml) is unreachable at every width.
#
# The placement lane is what restores it: cutting the gate-and-up contraction — one node with one
# weight channel per projection copy, since their K axes unify — into its own kernel gives that
# piece a grid the block-scaled cell binds on. This case pins that route and the row it realizes,
# so a placement seam this kernel must keep offering stays covered.
compute_cap: [12, 0]
programs:
- inputs: [x]
  outputs: [linear_2]
  nodes:
  - id: mul_static_fp4_f16_f4_pairs
    op: constant
    attrs:
      name: mul_static_fp4_f16_f4_pairs
      source_shape:
      - 256
      - 2
      source_dtype: f16
      source_graph:
        inputs: []
        outputs: [pairs_cast]
        nodes:
        - id: codes
          op: tensor.range
          attrs: {stop: 256, dtype: i32}
          outputs: [[codes, i32, [256]]]
        - id: mask
          op: constant
          attrs: {name: mask, value: 15}
          outputs: [[mask, i32, [1]]]
        - id: mask_bc
          op: tensor.index_map
          attrs: {out_shape: [256], sources: [{input_idx: 0, coord_map: ['0']}]}
          inputs: [mask]
          outputs: [[mask_bc, i32, [256]]]
        - id: low
          op: tensor.elementwise
          attrs: {op: bitwise_and}
          inputs: [codes, mask_bc]
          outputs: [[low, i32, [256]]]
        - id: shift
          op: constant
          attrs: {name: shift, value: 4}
          outputs: [[shift, i32, [1]]]
        - id: shift_bc
          op: tensor.index_map
          attrs: {out_shape: [256], sources: [{input_idx: 0, coord_map: ['0']}]}
          inputs: [shift]
          outputs: [[shift_bc, i32, [256]]]
        - id: high
          op: tensor.elementwise
          attrs: {op: right_shift}
          inputs: [codes, shift_bc]
          outputs: [[high, i32, [256]]]
        - id: vhigh
          op: tensor.elementwise
          attrs: {op: from_f4e2m1}
          inputs: [high]
          outputs: [[vhigh, f32, [256]]]
        - id: vlow
          op: tensor.elementwise
          attrs: {op: from_f4e2m1}
          inputs: [low]
          outputs: [[vlow, f32, [256]]]
        - id: pairs
          op: tensor.index_map
          attrs:
            out_shape:
            - 256
            - 2
            sources:
            - {input_idx: 0, coord_map: [out_coord_0], select: out_coord_1 < 1}
            - {input_idx: 1, coord_map: [out_coord_0]}
          inputs: [vlow, vhigh]
          outputs: [[pairs, f32, [256, 2]]]
        - id: pairs_cast
          op: tensor.elementwise
          inputs: [pairs]
          outputs: [[pairs_cast, f16, [256, 2]]]
    outputs: [[mul_static_fp4_f16_f4_pairs, f16, [256, 2]]]
  - id: mul_static_fp4_f4_max
