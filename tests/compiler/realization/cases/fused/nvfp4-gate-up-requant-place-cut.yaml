# The serving W4A4 MLP shape: gate + up + SiLU + the NVFP4 re-encode of their product, the one
# fused kernel a coded-trunk decode step spends most of its time in. The encode emits two outputs
# at two extents — packed codes over the feature axis and one e4m3 block scale per 16 of them — so
# the free-axis peel keeps only the token axis, the two outputs hang off the root term as their own
# branches, and every contraction sits below one of them. There the grid supplies no (m, n) pair,
# and the tensor-core tier that the same gate+up tree takes without the encode
# (gate-up-shared-a.yaml) is unreachable at every width.
#
# The placement lane is what restores it: cutting the gate contraction into its own kernel gives
# that piece a grid the block-scaled cell binds on. This case pins that route and the row it
# realizes, so a placement seam this kernel must keep offering stays covered.
