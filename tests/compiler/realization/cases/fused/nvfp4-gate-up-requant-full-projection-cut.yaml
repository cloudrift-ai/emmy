# The same serving W4A4 MLP shape as nvfp4-gate-up-requant-place-cut.yaml — gate + up + SiLU and the
# NVFP4 re-encode of their product — pinned to the route that takes its projection apart.
#
# Fused, that projection is one kernel at grid 1. Its two outputs ride different widths, so no axis
# is on both stores' sweep paths and nothing promotes onto the launch; every one of its eight
# contractions then sits under a serial sweep with no (m, n) pair to tile, and the binder builds
# around one of them and lowers the rest inside the projection. The sibling case cuts one
# contraction out and leaves the rest of that shape standing.
#
# This case pins the FULL-PROJECTION CUT: every contraction its own kernel, and each of the two
# outputs its own kernel over the sweep its store rides. Ten kernels: eight contractions with one
# root each, and the packed-code piece across the feature axis at 128 blocks of 256 threads, where
# the fused kernel spends one block walking that axis in a loop.
#
# What the entries below pin is that kernel set and one enumerable schedule per piece. Which tier
# each contraction then reaches is a pricing question the deploy answers, and the perf lane
# measures; a row here would only freeze one answer to it.
