name: Set up Emmy
description: Python, the Rust toolchain the runtime extension builds with, and `make setup-ci` into ./venv.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      shell: bash
      run: make setup-ci
