# Fill in a hardware golden's missing measurements on its own card: every proposal row (no Emmy time) and every
# target with no torch.compile time, as `emmy golden list --missing` names them. The nightly refresh picks one file
# whose card CloudRift can rent, runs this row with `--filter golden=PATH`, and commits the returned working.json over
# the file. `fill.sh` records the rows with a schedule first, each as an isolated record of its own kernel, then the
# whole targets; a row that fails to record is listed in failed.txt and stays missing, and the run stops starting rows
# when `budget_s` is spent, so a large file fills over several nights.
command:
  stage:
    - emmy
    - crates
    - pyproject.toml
    - requirements.txt
    - Makefile
    - Cargo.toml
    - Cargo.lock
    - .github/golden-fill/fill.sh
  run: |
    set -uo pipefail
    export PATH=$$HOME/.cargo/bin:/usr/local/cuda/bin:$$PATH
    cd $repo_dir
    sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq || exit 1
    sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq make python3.12-venv || exit 1
    command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
    [ -d venv ] || make setup || exit 1
    export EMMY_TUNE_DB=$task_dir/autotune.db EMMY_CUBIN_CACHE=$task_dir/cubins EMMY_NVCC_FLAGS=
    export CUDA_VISIBLE_DEVICES="$gpu_device_ids"
    bash .github/golden-fill/fill.sh "$golden" $task_dir $budget_s
  result_files:
    - working.json
    - missing.json
    - still_missing.json
    - failed.txt
    - fill.log
  timeout: 9000

# One row per hardware golden on its own card; tests/github/test_golden_fill_recipe.py keeps the list whole.
matrices:
  - golden: emmy/compiler/pipeline/search/golden/records/a100_sm80.json
    deploy.gpu: "NVIDIA A100 40GB"
    deploy.gpu_count: 1
    budget_s: 7200
