name: Publish to PyPI

# pyproject.toml holds the version either way. Two ways in:
#   * run this workflow — it publishes to PyPI first and then creates the tag and
#     release, so a failed upload leaves nothing behind;
#   * publish a GitHub Release by hand — the tag must then agree with pyproject.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the release source
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Releases must publish a commit already on main"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The wheel carries the runtime extension, built with cargo.
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve the version to publish
        id: version
        run: |
          PKG_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # We mint the tag ourselves, so pyproject is the only input. Bumping it
            # is what makes a release; refuse if that bump was forgotten.
            if git ls-remote --exit-code --tags origin "refs/tags/v$PKG_VERSION" >/dev/null 2>&1; then
              echo "::error::v$PKG_VERSION is already released — bump version in pyproject.toml"
              exit 1
            fi
          elif [ "$PKG_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Version mismatch: pyproject.toml=$PKG_VERSION, tag=$GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      # Installs the minimal build dependencies before staging. Pull-request CI
      # dry-runs this exact target so the publishing path cannot drift untested.
      - name: Build the PyPI distribution
        run: make pypi-dist

      - name: Smoke-test the PyPI distribution
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # One wheel, for this runner's platform: it carries the runtime extension. The sdist
          # builds the extension wherever a Rust toolchain exists and installs pure without one.
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          SMOKE_ENV="$RUNNER_TEMP/emmy-release-smoke"
          CATALOG="$RUNNER_TEMP/emmy-recipes.json"
          python -m venv "$SMOKE_ENV"
          "$SMOKE_ENV/bin/pip" install --disable-pip-version-check "$WHEEL"
          "$SMOKE_ENV/bin/python" -c 'import emmy.emmy_runtime'  # loads without a GPU; the driver is opened lazily
          test "$("$SMOKE_ENV/bin/emmy" --version)" = "emmy $VERSION"
          "$SMOKE_ENV/bin/emmy" recipe list --json > "$CATALOG"
          "$SMOKE_ENV/bin/python" -c \
            'import json, sys; assert json.load(open(sys.argv[1]))["recipes"], "wheel contains no recipes"' \
            "$CATALOG"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Only for the dispatched path: a hand-published release already has both.
  github-release:
    needs: [build, publish]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
