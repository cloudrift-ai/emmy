model:
  huggingface: "Qwen/Qwen3-Coder-Next-FP8"
  rationale: "Current-gen vendor FP8 coder serving 262K context; active Qwen coder momentum."
  heat: 48
engine:
  llm:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    gpu_memory_utilization: 0.9
