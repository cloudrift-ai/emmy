# Qwen3.8-27B-FP8 on four V100 SXM2 16 GB (sm_70 Volta), and on part of one H200.
#
#   emmy deploy ssh --recipe recipes/Qwen3.8-27B-FP8 --ssh user@host
#
# This is a DEPLOYMENT config, not an experiment: one variant per platform, no workload grid, no
# `benchmark:` block. The workload grid that justifies the Volta values lives in
# experiments/Qwen3.8-27B-FP8/serving/.
#
# SCOPE: the Volta lane is the platform that was actually qualified. The discovery shell it
# replaced proposed one RTX PRO 6000 Blackwell Max-Q and one H200 141GB; the Max-Q remains
# UNQUALIFIED here, which means unmeasured, not unsuitable. The H200 entry below exists so this
# model can share one H200 with Ornith-1.5-35B-A3B-FP8 through a deploy plan; it runs stock vLLM
# with Hopper's native FP8, keeps the vision tower so that lane serves images as well as text, and is
# sized from the checkpoint, unverified until a record run on an H200.
#
# This recipe serves stock engines. Emmy serves the Volta shape too (serving-v100.env, golden/v100_sm70.json), but
# far slower than stock today. See RESULTS.md.
tags:
  - maintained

model:
  huggingface: Qwen/Qwen3.8-27B-FP8
  rationale: "Benefits from 27B line download utility and FP8 serving value, offset by weak arena positioning."
  heat: 62
  revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
  task: generate

engine:
  llm:
    # 30.9 GB of FP8 weights give a min-to-serve near 40.2 GB, so four cards
    # (4 x 16,384 MiB = 68.7 GB) are the smallest admissible platform; two hold only 34.4 GB.
    # TP4 divides cleanly: 24 attention heads / 4 = 6, 4 key/value heads / 4 = 1.
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    # The fraction this lane declares for GPU sharing. The Volta entry pins its key/value cache with
    # --kv-cache-memory-bytes below, so the engine does not size the cache from it. See below.
    gpu_memory_utilization: 0.88
    # The full native window fits: the pinned KV pool holds 289,050 tokens, 1.10x concurrency at
    # full context, and a planted marker was retrieved from a 240,046-token prompt in 194 s.
    context_length: 262144
    # Concurrency 16, not 4. At 1,000-token prompts the cap drives throughput almost linearly:
    # 40.8 tok/s at 4, 76.8 at 8, 133.8 at 16, 235.5 at 32, while per-token decode latency moves
    # only 92 -> 116 ms across that range. 16 holds P99 time to first token under 6 s; 32 pushes it
    # to 9.9 s, which is the wrong trade when a caller is waiting. Long prompts are not harmed: the
    # engine admits what the KV pool holds and queues the rest, so a full-window request serializes
    # (1.10x at 262,144 tokens) whatever this cap says, and queued time to first token grows by
    # whole prefills rather than collapsing into preemption. Raising --max-num-batched-tokens to
    # 8192 was measured and rejected: it grew the pool to 355,162 tokens but left every row inside
    # run-to-run noise and made 4K prompts at 16 concurrent 69% slower. See RESULTS.md.
    max_concurrent_requests: 16
    vllm:
      # Stock vLLM has no sm_70 support. This is the 1Cat-vLLM Volta fork; the tag is named for
      # the model it was first built for, but the wheel is the whole fork. It is the first
      # published sm70 image new enough for Qwen3.8: its qwen3_5 config defaults
      # partial_rotary_factor to 0.25 and its Gated DeltaNet layer accepts output_gate_type
      # "swish", both of which Qwen3.8 declares and the older 1cat-vllm-sm70:1.0.0 does not know.
      image: "cloudriftai/1cat-vllm-deepseek-v4-flash-0731:1.2.3-d76126608"
      # --dtype half sets the compute dtype; Volta has no bfloat16. --language-model-only drops
      # the vision tower; the text path is what is qualified here.
      # --enable-prompt-tokens-details exposes each prefix-cache hit in OpenAI usage responses so
      # callers can meter cached input separately from uncached input.
      # --exclude-tools-when-tool-choice-none: with tool_choice "none" the tool list otherwise
      # stays in the prompt, the model still writes its <tool_call> markup, and nothing parses
      # it, so the markup comes back as the answer text (3/3 before this flag).
      # --structured-outputs-config: tool_choice "required" is served by a JSON-array grammar, and
      # the default grammar allows unlimited whitespace between tokens. Greedy decoding on a
      # greeting ("Hi there!") then opens "[" and emits newlines forever: 256, 2,048 and 4,096
      # max_tokens all ended at finish_reason "length" with zero tool calls (70 s of whitespace at
      # 4,096), and the caller got neither content nor tool_calls. Sampling at temperature >= 0.7
      # escapes it, greedy does not. disable_any_whitespace is honoured only by the xgrammar and
      # guidance backends (vllm/config/structured_outputs.py), so the backend is pinned with it.
      # --kv-cache-memory-bytes pins the key/value cache at 4.5 GiB per card. Sized from the fraction,
      # the cache depended on a start-up memory profile that differs by ~1.5 GiB between a cold start
      # and a restart with a warm compile cache: 0.88 gave ~4.5 GiB cold but 6.02 GiB warm, and the
      # warm size ran out of memory twice in production mid-request, five days apart, when an 80 MiB
      # prefill buffer no longer fit beside it. Lowering the fraction does not help: at 0.85 a cold
      # start falls 40 MiB short of one full-window request and fails. 4.5 GiB is the cold size that
      # served for eleven days, on every start. See RESULTS.md.
      # The single quotes around the JSON are required. Compose renders `command:` as one string
      # and splits it with shell-style word splitting, which consumes the inner double quotes and
      # hands vLLM the invalid {backend:xgrammar,...}. The single quotes are consumed instead, so
      # the JSON arrives whole.
      extra_args: >-
        --dtype half
        --enable-prefix-caching
        --enable-prompt-tokens-details
        --language-model-only
        --gdn-prefill-backend triton
        --max-num-batched-tokens 4096
        --kv-cache-memory-bytes 4831838208
        --enable-auto-tool-choice
        --tool-call-parser qwen3_coder
        --exclude-tools-when-tool-choice-none
        --structured-outputs-config '{"backend":"xgrammar","disable_any_whitespace":true}'
        --reasoning-parser qwen3

# The host must have NVLink up. On CloudRift that means a VM image newer than the catalog default
# (ubuntu-noble-server-gpup-580-129-20260430-084759 sets NvLinkDisable=1); this lane was measured on
# ubuntu-noble-server-gpup-580-129-20260810-232733. Without NVLink, time to first token is 2.5-3.5x
# longer and prompts past about 190K exceed a 300 s client timeout. Check with `nvidia-smi topo -m`:
# linked pairs show NV1/NV2, not PHB.
matrices:
  - deploy.gpu: "NVIDIA Tesla V100 SXM2 16GB"
    deploy.gpu_count: 4
    # These switches live on the Volta entry, not in the base, because a matrix entry can add to
    # the base's environment but not take from it, and the H200 entry below must not carry them.
    engine.llm.vllm.extra_env:
      # Volta has no FP8 arithmetic. The fork serves FP8 checkpoints on sm_70 through its
      # TurboMind dequantization path, which these two switches select; neither is baked into
      # the image, and the DeepSeek-V4-Flash lane on this same engine sets them the same way.
      VLLM_SM70_FP8_TURBOMIND: "1"
      VLLM_SM70_QUANT_BACKEND: "turbomind"
      # 48 of the 64 layers are Gated DeltaNet, so that path is unavoidable. This image cannot
      # build the Volta-native flash_qla GDN extension: it ships the sources but not the CUDA
      # development headers, so the JIT fails at `fatal error: cusparse.h`. Selecting the Triton
      # GDN *prefill* backend above is not sufficient, because the GDN decode path reaches for
      # flash_qla independently; this knob is what keeps the JIT out of the run.
      VLLM_SM70_GDN_DECODE_FLASHQLA: "0"

  # Reduced-fraction entry so this model can share an H200 with Ornith-1.5-35B-A3B-FP8 at 0.35 through
  # a deploy plan, and the one lane of this recipe that serves images: the vision tower stays loaded
  # (no --language-model-only), a request is bounded to four images and no video, which bounds the
  # encoder's profiling peak, and the entry declares image input for itself (the list inside a list
  # keeps it a value rather than a matrix axis), so the catalog advertises images on this deployment
  # while the Volta lane keeps its qualified text-only shape.
  # 0.55 x 141 GB is a ~77 GiB budget: 28.8 GiB of FP8 weights, the ~0.8 GiB BF16 tower and ~1.5 GiB
  # of engine overhead leave ~45 GiB for the encoder cache and KV, about 700K tokens at 64 KiB each
  # (16 full-attention layers x 4 KV heads x 256), so the full 262,144-token window fits with more than
  # two sequences resident, or sixteen ~44K-token requests at the inherited concurrency. Of the pair
  # this is the model to carry vision: Qwen3.8 is Qwen's own vision-language release and this share
  # has the KV headroom to pay for the tower, where Ornith's 12.6 GiB pool is the tight one. Stock
  # vLLM on Hopper: native FP8 and BF16, its own attention and Gated DeltaNet kernels, the engine's
  # default prefill chunk. The flags kept are the ones about the model's own behaviour (tool and
  # reasoning parsers, the tool_choice "none" and "required" fixes explained above); the Volta ones
  # are left out. A max_pixels bound through --mm-processor-kwargs is left for the record run, where
  # the processor's accepted keys can be checked against the engine rather than guessed. Unverified
  # until a record run on an H200 with an image request beside the text probes.
  - deploy.gpu: "NVIDIA H200 141GB"
    deploy.gpu_count: 1
    model.input_modalities: [[text, image]]
    engine.llm.tensor_parallel_size: 1
    engine.llm.gpu_memory_utilization: 0.55
    engine.llm.vllm.image: "vllm/vllm-openai:v0.30.0"
    engine.llm.vllm.extra_args: >-
      --enable-prompt-tokens-details
      --limit-mm-per-prompt '{"image": 4, "video": 0}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --exclude-tools-when-tool-choice-none
      --structured-outputs-config '{"backend":"xgrammar","disable_any_whitespace":true}'
      --reasoning-parser qwen3
