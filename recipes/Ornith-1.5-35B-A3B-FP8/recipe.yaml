# Ornith-1.5-35B-A3B-FP8 on one H100 80GB, deliberately using only part of the card.
# 36B-total / 3B-active hybrid MoE (3 linear-attention layers per full-attention layer, 256 routed experts,
# 8 active plus a shared expert), compressed-tensors FP8 per-channel weights with dynamic per-token
# activations. Qualified 2026-09-29 on vLLM v0.30.0 (experiments/Ornith-1.5-35B-A3B-FP8/serving):
# native 262144 context, tool calls, reasoning separation and a 236K-token recall probe all pass.
# gpu_memory_utilization 0.75 is the deliberate share: ~35 GiB of weights plus a 22.9 GiB KV pool
# (1.17M tokens, 4.45 full-context sequences), leaving ~20 GiB of the card free for other work.
# Concurrency 64 is the measured balance: 3,826 output tok/s at 16.5 ms median TPOT on 1024/1024 traffic;
# 256 doubles throughput but doubles per-stream latency (see the experiment's RESULTS.md).
# Text-only serving: the checkpoint is a vision-language wrapper; --language-model-only drops the tower.
tags:
  - best-effort
model:
  huggingface: ornith-ai/Ornith-1.5-35B-A3B-FP8
  revision: fab11c26e2325a42f4b32da0249c819a0bade1b1
  rationale: 'FP8 twin of the Ornith-1.5-35B-A3B shell: a 36B-total, 3B-active agentic coding MoE whose FP8 weights (~37
    GiB) serve within a fraction of one datacenter card.'
  heat: 0
  task: generate

engine:
  llm:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    gpu_memory_utilization: 0.75
    context_length: 262144
    max_concurrent_requests: 64
    vllm:
      image: "vllm/vllm-openai:v0.30.0"
      extra_args: "--enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --language-model-only"

matrices:
  deploy.gpu: NVIDIA H100 80GB
  deploy.gpu_count: 1
