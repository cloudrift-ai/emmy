# Gemma 4 12B end-to-end serving on one RTX 5090 — the three vLLM lanes of the "Outperforming vLLM and Llama.cpp on
# Gemma4-12B" article (stock vLLM 0.23.0, vLLM + the Emmy plugin, and its EMMY_FAST_MATH fork) on the article's six
# points, re-measured on the current compiler with the re-recorded serving golden.
#
# The Emmy lanes boot under EMMY_STRICT_EVIDENCE=1: every fork of every kernel the server compiles is decided by a
# row of the RTX 5090 Gemma 4 serving golden (recipes/gemma-4-12B-it/golden/rtx5090_sm120.yaml), and a fork no row
# decides fails the boot instead of falling to the prior. The image is the plain vllm-emmy base built at this
# commit (`make vllm-emmy-image`; the tag carries the short sha), not a warmed derivative: an Emmy lane compiles its
# programs on first boot (about 20 minutes on the 5090 with cubins cached) and writes its execution-plan pack to
# EMMY_PACK_DIR, so the second boot of a shape in a lane is a pack hit. The stock lane is the upstream image.
#
# Workload, knobs and points are the article's (see experiments/gemma-4-12B/serving_rtx5090, whose comments hold the
# protocol history): every lane runs at --gpu-memory-utilization 0.96; the Emmy lanes set the decode bucket to the
# smallest recorded width that holds the concurrency (8 at c=1, c=4 and c=8, 64 at c=64) and the 2048-token chunk
# quantum on the mixed 4K/4K c=4, c=8 and 256/256 c=64 cells; single-stream points repeat three times, batched points
# once. Compare lanes only within one run on one box. The article ran its c=1 points at bucket 32; its width-8 rows
# are faster per layer (about 12 us, 0.55 ms per token) now that they are recorded, and a single stream fits either.
#
# Repro on a pre-allocated card (no cloud provisioning):
#   make vllm-emmy-image
#   emmy bench experiments/golden-bench-2026/gemma4_serving --local
model:
  huggingface: "google/gemma-4-12B-it"
  revision: 707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7

engine:
  llm:
    tensor_parallel_size: 1
    context_length: 16384
    vllm:
      extra_args: "--dtype float16 --no-enable-prefix-caching"

benchmark:
  seed: 0
  temperature: 0
  ignore_eos: true

matrices:
  # ---- stock vLLM: all six points ----
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    engine.llm.gpu_memory_utilization: 0.96
    engine.llm.vllm.image: "vllm/vllm-openai:v0.23.0"
    zip:
      benchmark.random_input_len: [256, 256, 4096, 4096, 4096, 8192]
      benchmark.random_output_len: [256, 256, 4096, 4096, 4096, 256]
      benchmark.max_concurrency: [1, 64, 1, 4, 8, 4]
      benchmark.num_prompts: [16, 256, 8, 32, 64, 16]
      benchmark.repeats: [3, 1, 3, 1, 1, 1]

  # ---- emmy lanes: c=1 points (decode bucket 8; default chunk width 4096 + rider headroom) ----
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    engine.llm.gpu_memory_utilization: 0.96
    engine.llm.vllm.image: "cloudriftai/vllm-emmy:0.23.0-6328269d1"
    engine.llm.vllm.extra_args: "--runner generate --dtype float16 --hf-overrides '{\"architectures\":[\"EmmyGenModel\"]}' --max-num-batched-tokens 4104 --no-enable-prefix-caching"
    cross:
      engine.llm.vllm.extra_env: ["EMMY_STRICT_EVIDENCE=1 EMMY_CUBIN_CACHE=/hf_models/emmy-cubins EMMY_PACK_DIR=/hf_models/emmy-pack-6328269d1 EMMY_GEN_DECODE_BUCKET=8", "EMMY_STRICT_EVIDENCE=1 EMMY_FAST_MATH=1 EMMY_CUBIN_CACHE=/hf_models/emmy-cubins EMMY_PACK_DIR=/hf_models/emmy-pack-6328269d1 EMMY_GEN_DECODE_BUCKET=8"]
      zip:
        benchmark.random_input_len: [256, 4096]
        benchmark.random_output_len: [256, 4096]
        benchmark.max_concurrency: [1, 1]
        benchmark.num_prompts: [16, 8]
        benchmark.repeats: [3, 3]

  # ---- emmy lanes: the mixed 4K/4K c=4 and c=8 points (bucket 8 + the 2048 chunk quantum) ----
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    engine.llm.gpu_memory_utilization: 0.96
    engine.llm.vllm.image: "cloudriftai/vllm-emmy:0.23.0-6328269d1"
    engine.llm.vllm.extra_args: "--runner generate --dtype float16 --hf-overrides '{\"architectures\":[\"EmmyGenModel\"]}' --max-num-batched-tokens 2056 --no-enable-prefix-caching"
    cross:
      engine.llm.vllm.extra_env: ["EMMY_STRICT_EVIDENCE=1 EMMY_CUBIN_CACHE=/hf_models/emmy-cubins EMMY_PACK_DIR=/hf_models/emmy-pack-6328269d1 EMMY_GEN_DECODE_BUCKET=8 EMMY_GEN_PREFILL_BUCKET=2048", "EMMY_STRICT_EVIDENCE=1 EMMY_FAST_MATH=1 EMMY_CUBIN_CACHE=/hf_models/emmy-cubins EMMY_PACK_DIR=/hf_models/emmy-pack-6328269d1 EMMY_GEN_DECODE_BUCKET=8 EMMY_GEN_PREFILL_BUCKET=2048"]
      zip:
        benchmark.random_input_len: [4096, 4096]
        benchmark.random_output_len: [4096, 4096]
        benchmark.max_concurrency: [4, 8]
        benchmark.num_prompts: [32, 64]
        benchmark.repeats: [1, 1]

  # ---- emmy lanes: the RAG 8192/256 c=4 point (bucket 8; chunk width 4096 + rider headroom) ----
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    engine.llm.gpu_memory_utilization: 0.96
    engine.llm.vllm.image: "cloudriftai/vllm-emmy:0.23.0-6328269d1"
    engine.llm.vllm.extra_args: "--runner generate --dtype float16 --hf-overrides '{\"architectures\":[\"EmmyGenModel\"]}' --max-num-batched-tokens 4104 --no-enable-prefix-caching"
    cross:
      engine.llm.vllm.extra_env: ["EMMY_STRICT_EVIDENCE=1 EMMY_CUBIN_CACHE=/hf_models/emmy-cubins EMMY_PACK_DIR=/hf_models/emmy-pack-6328269d1 EMMY_GEN_DECODE_BUCKET=8", "EMMY_STRICT_EVIDENCE=1 EMMY_FAST_MATH=1 EMMY_CUBIN_CACHE=/hf_models/emmy-cubins EMMY_PACK_DIR=/hf_models/emmy-pack-6328269d1 EMMY_GEN_DECODE_BUCKET=8"]
    benchmark.random_input_len: 8192
    benchmark.random_output_len: 256
    benchmark.max_concurrency: 4
    benchmark.num_prompts: 16

  # ---- emmy lanes: the 256/256 c=64 point (decode bucket 64 + the 2048 chunk quantum) ----
  # The quantum joined this lane on 2026-08-02 after a same-box A/B at the article's single-wave
  # TTFT protocol (--num-prompts 64), both precision lanes, every shape pack-hit:
  #
  #   lane        no quantum   + 2048 quantum
  #   emmy std      2263 ms      1986 ms   (-12%)
  #   emmy fm       1834 ms      1688 ms   (-8%)
  #   stock         1512 ms
  #
  # It is not a KV-capacity effect, which was the leading hypothesis and is refuted: this
  # workload needs 64 x 512 = 32,768 KV tokens and emmy has 43,499 without the quantum (65,232
  # with it), so all 64 requests are resident either way. The gain is step structure — shorter
  # chunk steps interleave first tokens sooner. The lane still trails stock by ~12% on TTFT;
  # the residual is the plugin running a mixed prefill+decode step as two passes over disjoint
  # rows where stock composes one fused varlen batch, which is a serving-stack change rather
  # than a knob. TPOT at this point is already at parity (26.7 vs stock 26.9).
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    engine.llm.gpu_memory_utilization: 0.96
    engine.llm.vllm.image: "cloudriftai/vllm-emmy:0.23.0-6328269d1"
    engine.llm.vllm.extra_args: "--runner generate --dtype float16 --hf-overrides '{\"architectures\":[\"EmmyGenModel\"]}' --max-num-batched-tokens 2112 --no-enable-prefix-caching"
    cross:
      engine.llm.vllm.extra_env:
        - "EMMY_STRICT_EVIDENCE=1 EMMY_CUBIN_CACHE=/hf_models/emmy-cubins EMMY_PACK_DIR=/hf_models/emmy-pack-6328269d1 EMMY_GEN_DECODE_BUCKET=64 EMMY_GEN_PREFILL_BUCKET=2048"
        - "EMMY_STRICT_EVIDENCE=1 EMMY_FAST_MATH=1 EMMY_CUBIN_CACHE=/hf_models/emmy-cubins EMMY_PACK_DIR=/hf_models/emmy-pack-6328269d1 EMMY_GEN_DECODE_BUCKET=64 EMMY_GEN_PREFILL_BUCKET=2048"
    benchmark.random_input_len: 256
    benchmark.random_output_len: 256
    benchmark.max_concurrency: 64
    benchmark.num_prompts: 256
