# One bounded model-derived corpus and its diagnostics. Every row is an ordinary matrix task on a shared per-GPU VM;
# the study field keeps the headline common corpus, large-shape supplement, convergence check, and ablation separate.
#
# A row that names a `golden` replays `golden/<golden>.golden.json` instead of tracing and searching: those
# schedules were measured and committed beside this recipe, and the row only re-measures them
# at deployable -O3. Rows with `golden: ""` trace, measure the greedy pick, then tune each measured kernel. Both paths end in the same
# fresh-process `emmy run --golden ... --bench --strict` repeats against eager and Emmy, so the two lanes produce
# the same terminal correctness evidence. Committed goldens also require measured evidence for every compiler
# choice. A separate torch.compile run is diagnostic because a reference backend
# can be unavailable for a valid target; its absence must not fail an otherwise-correct Emmy replay. It times the
# Hugging Face layer (`emmy run MODEL --layer N`) with the working golden as evidence. For quantized checkpoints,
# eager and torch.compile use the loader's decoded-weight module while Emmy restores the quantized algebra in its
# graph. That comparison is separate from generated-input golden replay and is not a native FP8-library comparison.
command:
  stage:
    - emmy
    - pyproject.toml
    - requirements.txt
    - Makefile
    - Cargo.toml
    - Cargo.lock
    - crates
    - experiments/golden-bench-2026/kernels/recipe.yaml
    - experiments/golden-bench-2026/kernels/golden
  strict: true
  run: |
    set -euo pipefail
    export PATH=/usr/local/cuda/bin:$$HOME/.cargo/bin:$$PATH
    cd $repo_dir
    mkdir -p $task_dir/verification
    finalize() {
      final_status=$$?
      trap - EXIT
      if [ -x ./venv/bin/python ]; then
        ./venv/bin/python -m pip freeze --all > $task_dir/requirements.freeze.txt || final_status=1
      else
        echo "venv pip unavailable" > $task_dir/requirements.freeze.txt
        final_status=1
      fi
      printf 'study=%s\nstatus=%s\n' "$study" "$$final_status" > $task_dir/status.txt
      archive_tmp=$task_dir.artifacts.tar.gz
      tar -C $task_dir -czf "$$archive_tmp" . || final_status=1
      mv "$$archive_tmp" $task_dir/artifacts.tar.gz || final_status=1
      exit "$$final_status"
    }
    trap finalize EXIT

    [ -d venv ] || make setup
    # Keep the reference compiler version fixed across newly provisioned and existing hosts.
    if [ "$$(./venv/bin/python -c 'import torch; print(torch.__version__.split("+")[0])')" != "2.13.0" ]; then
      ./venv/bin/python -m pip install 'torch==2.13.0'
    fi
    # The current default PyTorch wheel omits sm70, so restore a V100-capable wheel after setup.
    if [ "$$(./venv/bin/python -c 'import torch; major, minor = torch.cuda.get_device_capability(); print(f"sm_{major}{minor}")')" = "sm_70" ] && \
       ! ./venv/bin/python -c 'import torch; assert "sm_70" in torch.cuda.get_arch_list()'; then
      ./venv/bin/pip install --index-url https://download.pytorch.org/whl/cu126 'torch==2.13.0+cu126'
    fi
    # A venv staged before the runtime was compiled lacks the extension; build it in place.
    ./venv/bin/python -c 'import emmy.emmy_runtime' 2>/dev/null || ./venv/bin/python -m pip install -q -e .
    export EMMY_TUNE_DB=$task_dir/autotune.db
    export EMMY_ONLINE_FILE=$task_dir/online.json
    export EMMY_CUBIN_CACHE=$task_dir/cubins
    # Fast math is the compiler default since #868, and every golden beside this recipe records
    # FAST_MATH: false. A row is evidence only in the precision regime it was measured in, so
    # without this pin the replay lane loads the file and then prices every fork from the prior
    # instead of from the schedules it committed. Pin the regime the rows were recorded in.
    export EMMY_FAST_MATH=0
    export EMMY_NVCC_FLAGS=
    export EMMY_BENCH_RUN_TIMEOUT_S=60
    export EMMY_KERNEL_TIMEOUT_MS=120000
    export EMMY_FP8_MMA=$fp8_mma
    devices="$gpu_device_ids"
    first_device=$${devices%%,*}

    tuning_accuracy_args=(--strict)
    # FP8 quantization can move a code by one step under a small arithmetic difference. Use the existing
    # dtype-scaled comparison while recording candidates; the five strict replays still report those differences.
    if [ "$study" = "fp8-common" ]; then
      tuning_accuracy_args=()
    fi
    evidence_args=()
    tuning_status=0
    record_final_status=0
    if [ -n "$golden" ]; then
      evidence_args=(--strict-evidence --no-record-evidence)
      cp $repo_dir/experiments/golden-bench-2026/kernels/golden/$golden.golden.json $task_dir/working.json
      echo "replaying committed golden $golden" | tee $task_dir/trace.log
      echo "replaying committed measured schedules; this row does not search" | tee $task_dir/tune.log
    else
      trace_args=(
        ./venv/bin/emmy trace "$model_ref" --layer "$layer" --seq-len "$seq_len"
        --model-provenance "$model_ref" --output $task_dir/working.json
      )
      "$${trace_args[@]}" 2>&1 | tee $task_dir/trace.log

      if [ "$budget" = "0" ]; then
        echo "tuning intentionally skipped for the cold greedy case" | tee $task_dir/tune.log
      else
        # Establish a measured kernel set before tuning its pieces. The budget is schedule trials per kernel;
        # this replaces the retired whole-program search and does not claim its candidate or patience semantics.
        ./venv/bin/emmy run --golden $task_dir/working.json --bench "$${tuning_accuracy_args[@]}" \
          --json $task_dir/initial --warmup 10 --iters 100 --bench-backends eager,emmy 2>&1 | tee $task_dir/tune.log
        ./venv/bin/emmy run --golden $task_dir/working.json --bench "$${tuning_accuracy_args[@]}" --record-greedy \
          --json $task_dir/record-initial --warmup 10 --iters 100 2>&1 | tee -a $task_dir/tune.log
        ./venv/bin/python -c 'import sys; from emmy.compiler.pipeline.search.golden import GoldenFile; d = GoldenFile.load(sys.argv[1]); print("\n".join(sorted({r.kernel for r in d.rows if r.measured})))' \
          $task_dir/working.json > $task_dir/kernels.txt
        mkdir -p $task_dir/tuning
        while IFS= read -r kernel; do
          if EMMY_KNOBS=PLACE=fuse ./venv/bin/emmy run --golden $task_dir/working.json --kernel "$$kernel" \
            --bench "$${tuning_accuracy_args[@]}" --tune "$budget" --warmup 10 --iters 100 \
            --json $task_dir/tuning/$$kernel.json 2>&1 | tee -a $task_dir/tune.log; then
            :
          else
            tuning_status=$$?
          fi
        done < $task_dir/kernels.txt
        # Rejected candidates remain failures, but the selected whole target still needs its accuracy diagnostics.
        if ./venv/bin/emmy run --golden $task_dir/working.json --bench "$${tuning_accuracy_args[@]}" --record-greedy \
          --json $task_dir/record-final --warmup 10 --iters 100 2>&1 | tee -a $task_dir/tune.log; then
          :
        else
          record_final_status=$$?
        fi
      fi
    fi
    printf '%s\n' "$$tuning_status" > $task_dir/tuning.status
    printf '%s\n' "$$record_final_status" > $task_dir/record-final.status

    mkdir -p $task_dir/torch-compile
    if EMMY_NVCC_FLAGS= EMMY_GOLDEN_FILE=$task_dir/working.json CUDA_VISIBLE_DEVICES="$$first_device" ./venv/bin/emmy run \
      "$model_ref" --layer "$layer" --seq-len "$seq_len" --bench "$${evidence_args[@]}" \
      --json $task_dir/torch-compile/model.json --warmup 10 --iters 100 \
      --bench-backends eager,tcompile,emmy 2>&1 | tee $task_dir/torch-compile.log; then
      torch_compile_status=0
    else
      torch_compile_status=$$?
    fi
    printf '%s\n' "$$torch_compile_status" > $task_dir/torch-compile.status

    # Every strict repeat runs even when one target fails its eager/Emmy correctness gate, so a single hard target
    # cannot discard the other four fresh-process replays. The per-repeat exit status is preserved and the task still
    # fails, so an Emmy failure is reported rather than hidden. torch.compile availability is non-gating above.
    verification_status=$$tuning_status
    [ "$$record_final_status" = 0 ] || verification_status=$$record_final_status
    for repeat in 0 1 2 3 4; do
      if [ -n "$golden" ]; then
        export EMMY_TUNE_DB=$task_dir/verification/repeat-$$repeat.db
      fi
      if EMMY_NVCC_FLAGS= CUDA_VISIBLE_DEVICES="$$first_device" ./venv/bin/emmy run \
        --golden $task_dir/working.json --bench --strict "$${evidence_args[@]}" \
        --json $task_dir/verification/repeat-$$repeat --warmup 10 --iters 100 \
        --bench-backends eager,emmy 2>&1 | tee $task_dir/verification-$$repeat.log; then
        repeat_status=0
      else
        repeat_status=$$?
        verification_status=$$repeat_status
      fi
      printf '%s\n' "$$repeat_status" > $task_dir/verification/repeat-$$repeat.status
    done
    exit "$$verification_status"
  result_files:
    - artifacts.tar.gz
  timeout: 86400

matrices:
  # Headline common corpus: identical model, layer, sequence lengths, budget, and correctness gate on every GPU.
  - cross:
      study: common
      model_ref: Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca
      layer: 0
      seq_len: [1, 512]
      budget: 12
      trial: 0
      fp8_mma: 0
      golden: ""
      zip:
        deploy.gpu:
          - "NVIDIA Tesla V100 SXM3 32GB"
          - "NVIDIA H200 141GB"
          - "NVIDIA B200"
        deploy.gpu_count: 1

  # The same common corpus on the A100, replaying the committed goldens instead of searching. The goldens were
  # recorded on the 40GB SXM4 part; the 80GB part is the same die at 2039 GB/s instead of 1555, so its row replays
  # the same schedules but is not comparable to the 40GB numbers: select one with --filter deploy.gpu=<name>.
  - cross:
      study: common
      model_ref: Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca
      layer: 0
      budget: 0
      trial: 0
      fp8_mma: 0
      deploy.gpu: ["NVIDIA A100 80GB", "NVIDIA A100 40GB"]
      deploy.gpu_count: 1
      zip:
        seq_len: [1, 512]
        golden: [qwen3-06b-s1_a100, qwen3-06b-s512_a100]

  # The same common corpus on the H100, replaying the committed hand-tuned goldens instead of searching.
  - cross:
      study: common
      model_ref: Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca
      layer: 0
      budget: 0
      trial: 0
      fp8_mma: 0
      deploy.gpu: "NVIDIA H100 80GB"
      deploy.gpu_count: 1
      zip:
        seq_len: [1, 512]
        golden: [qwen3-06b-s1_h100, qwen3-06b-s512_h100]

  # The same common corpus on the V100 SXM2 16GB, replaying the committed goldens instead of searching.
  - cross:
      study: common
      model_ref: Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca
      layer: 0
      budget: 0
      trial: 0
      fp8_mma: 0
      deploy.gpu: "NVIDIA Tesla V100 SXM2 16GB"
      deploy.gpu_count: 1
      zip:
        seq_len: [1, 512]
        golden: [qwen3-06b-s1_v100, qwen3-06b-s512_v100]

  # The same common corpus on the RTX 5090, replaying the committed goldens instead of searching.
  - cross:
      study: common
      model_ref: Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca
      layer: 0
      budget: 0
      trial: 0
      fp8_mma: 0
      deploy.gpu: "NVIDIA GeForce RTX 5090"
      deploy.gpu_count: 1
      zip:
        seq_len: [1, 512]
        golden: [qwen3-06b-s1_rtx5090, qwen3-06b-s512_rtx5090]

  # The same common corpus on the RTX 4090, replaying the committed goldens instead of searching.
  - cross:
      study: common
      model_ref: Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca
      layer: 0
      budget: 0
      trial: 0
      fp8_mma: 0
      deploy.gpu: "NVIDIA GeForce RTX 4090"
      deploy.gpu_count: 1
      zip:
        seq_len: [1, 512]
        golden: [qwen3-06b-s1_rtx4090, qwen3-06b-s512_rtx4090]

  # Dynamic-FP8 checkpoint layers on FP8-capable GPUs. A future golden filter will define the W8A8-only corpus.
  - cross:
      study: fp8-common
      model_ref: RedHatAI/Qwen3-0.6B-FP8-dynamic@068a9040b238d65f5c1064f10232bb15b96c0ff0
      layer: 0
      seq_len: [1, 512]
      budget: 12
      trial: 0
      fp8_mma: 1
      golden: ""
      zip:
        deploy.gpu:
          - "NVIDIA GeForce RTX 4090"
          - "NVIDIA GeForce RTX 5090"
          - "NVIDIA H200 141GB"
          - "NVIDIA B200"
        deploy.gpu_count: 1

  # One large dynamic-FP8 checkpoint layer on datacenter GPUs; W8A8-only reporting awaits a golden filter.
  - cross:
      study: fp8-large-layer
      model_ref: RedHatAI/Qwen3-32B-FP8-dynamic@c6732fc26128341172e4005bad34aafa51c32866
      layer: 0
      seq_len: [1, 512]
      budget: 8
      trial: 0
      fp8_mma: 1
      golden: ""
      zip:
        deploy.gpu: ["NVIDIA H200 141GB", "NVIDIA B200"]
        deploy.gpu_count: 1

  # Unsharded BF16 large-shape supplement; separate from the common-corpus geometric mean and not TP8 evidence.
  - cross:
      study: large-layer
      model_ref: Qwen/Qwen3.6-27B@6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
      layer: [0, 3]
      seq_len: [1, 512]
      budget: 8
      trial: 0
      fp8_mma: 0
      golden: ""
      zip:
        deploy.gpu: ["NVIDIA H200 141GB", "NVIDIA B200"]
        deploy.gpu_count: 1

  # Three fresh runs measure search stability; trial labels repeats, not random seeds of the deterministic tuner.
  - cross:
      study: convergence
      model_ref: Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca
      layer: 0
      seq_len: 512
      budget: 12
      trial: [0, 1, 2]
      fp8_mma: 0
      golden: ""
      deploy.gpu: "NVIDIA H200 141GB"
      deploy.gpu_count: 1

  # Dynamic-FP8 layer search stability; a W8A8-only stability claim awaits a golden filter.
  - cross:
      study: fp8-convergence
      model_ref: RedHatAI/Qwen3-0.6B-FP8-dynamic@068a9040b238d65f5c1064f10232bb15b96c0ff0
      layer: 0
      seq_len: 512
      budget: 12
      trial: [0, 1, 2]
      fp8_mma: 1
      golden: ""
      deploy.gpu: "NVIDIA H200 141GB"
      deploy.gpu_count: 1

  # Per-kernel schedule-budget ablation. Budget zero is a fresh cold-greedy process with empty local evidence.
  - study: search-ablation
    model_ref: Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca
    layer: 0
    seq_len: 512
    trial: 0
    fp8_mma: 0
    golden: ""
    deploy.gpu: "NVIDIA H200 141GB"
    deploy.gpu_count: 1
    zip:
      budget: [0, 4, 12, 48]
