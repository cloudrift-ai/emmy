# Minimal compiler support check for packed NVFP4, AWQ and Trellis/EXL3 checkpoints on one RTX 5090. Each row traces
# one pinned layer and strictly executes every distinct post-fusion target against its available reference, through
# the same `emmy run --golden ... --bench --strict` replay. A target without an eager slice can pass by comparing
# its saved output with itself; report that result as execution coverage, not independent accuracy validation.
command:
  stage:
    - emmy
    - pyproject.toml
    - requirements.txt
    - Makefile
    - Cargo.toml
    - Cargo.lock
    - crates
    - experiments/golden-bench-2026/quantized_kernels_rtx5090/recipe.yaml
  strict: true
  run: |
    set -euo pipefail
    export PATH=/usr/local/cuda/bin:$$HOME/.cargo/bin:$$PATH
    cd $repo_dir
    finalize() {
      final_status=$$?
      trap - EXIT
      if [ -x ./venv/bin/pip ]; then
        ./venv/bin/pip freeze --all > $task_dir/requirements.freeze.txt || final_status=1
      else
        echo "venv pip unavailable" > $task_dir/requirements.freeze.txt
        final_status=1
      fi
      printf 'format=%s\nstatus=%s\n' "$format" "$$final_status" > $task_dir/status.txt
      archive_tmp=$task_dir.artifacts.tar.gz
      tar -C $task_dir -czf "$$archive_tmp" . || final_status=1
      mv "$$archive_tmp" $task_dir/artifacts.tar.gz || final_status=1
      exit "$$final_status"
    }
    trap finalize EXIT

    [ -d venv ] || make setup
    # Keep the reference compiler version fixed across newly provisioned and existing hosts.
    if [ "$$(./venv/bin/python -c 'import torch; print(torch.__version__.split("+")[0])')" != "2.13.0" ]; then
      ./venv/bin/python -m pip install 'torch==2.13.0'
    fi
    ./venv/bin/python -c 'import emmy.emmy_runtime' 2>/dev/null || ./venv/bin/python -m pip install -q -e .
    export EMMY_TUNE_DB=$task_dir/autotune.db
    export EMMY_ONLINE_FILE=$task_dir/online.json
    export EMMY_CUBIN_CACHE=$task_dir/cubins
    export EMMY_FAST_MATH=0

    ./venv/bin/emmy trace "$model_ref" --layer 0 --seq-len "$seq_len" \
      --model-provenance "$model_ref" --output $task_dir/working.json 2>&1 | tee $task_dir/trace.log

    # The CLI walks every post-fusion target, preserves each result and fails if any target fails.
    EMMY_NVCC_FLAGS= EMMY_BENCH_RUN_TIMEOUT_S=60 EMMY_KERNEL_TIMEOUT_MS=120000 \
      CUDA_VISIBLE_DEVICES="$gpu_device_ids" ./venv/bin/emmy run \
      --golden $task_dir/working.json --bench --strict --no-record-evidence \
      --json $task_dir/verification --warmup 5 --iters 20 \
      --bench-backends eager,emmy 2>&1 | tee $task_dir/verification.log
  result_files:
    - artifacts.tar.gz
  timeout: 86400

matrices:
  - cross:
      format: nvfp4
      model_ref: nvidia/Qwen3-8B-NVFP4@ccd10a893cbca613259517c3efe08e151ddf2b8e
      seq_len: [1, 512]
      deploy.gpu: "NVIDIA GeForce RTX 5090"
      deploy.gpu_count: 1

  - format: awq
    model_ref: hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4@db1f81ad4b8c7e39777509fac66c652eb0a52f91
    seq_len: 1
    deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1

  - format: trellis
    model_ref: riftstack/Laguna-S-2.1-exl3@45c1f34a8c3ae3025a8bce2b1decea4991a6a239
    seq_len: 1
    deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
