# Replay the saved Neptune schedules from the prior A100 80GB search on an A100 40GB, then measure
# the five paper-table operators with the existing PyTorch-only evaluator. This measures portability
# only: it does not search and cannot claim the schedules are optimal for the 40GB card.
command:
  stage:
    - experiments/golden-bench-2026/compiler_neptune_emmy_pytorch_a100/run.sh
    - experiments/golden-bench-2026/compiler_neptune_emmy_pytorch_a100/run_neptune.py
    - experiments/golden-bench-2026/compiler_neptune_emmy_pytorch_a100/run_pytorch.py
    - experiments/golden-bench-2026/compiler_neptune_replay_a100/recipe.yaml
    - experiments/golden-bench-2026/compiler_neptune_replay_a100/tuning_a10080.tar.gz
  strict: true
  run: |
    set -euo pipefail
    IMAGE=evanzhao16/neptune-env@sha256:724d07594bc817f0fe94267b2d0dbdc6e29d3ae4a7e3516e553a6d9327bfebca
    NEPTUNE_REV=3aa55c12ac822337e630b809b0d9eabb11eee5d3
    SOURCE=$repo_dir/experiments/golden-bench-2026/compiler_neptune_emmy_pytorch_a100
    EXPERIMENT=$repo_dir/experiments/golden-bench-2026/compiler_neptune_replay_a100
    EVIDENCE=$task_dir/evidence
    mkdir -p "$$EVIDENCE"
    finalize() {
      final_status=$$?
      trap - EXIT
      if [ "$lane" = pytorch ]; then
        $repo_dir/venv/bin/pip freeze --all > "$$EVIDENCE/pytorch-requirements.freeze.txt" || final_status=1
      fi
      printf 'status=%s\n' "$$final_status" > $task_dir/status.txt
      archive_tmp=$task_dir.artifacts.tar.gz
      tar -C $task_dir -czf "$$archive_tmp" . || final_status=1
      mv "$$archive_tmp" $task_dir/artifacts.tar.gz || final_status=1
      exit "$$final_status"
    }
    trap finalize EXIT

    case "$lane" in
      neptune)
        sha256sum "$$EXPERIMENT/tuning_a10080.tar.gz" > "$$EVIDENCE/tuning-archive.sha256"
        docker pull "$$IMAGE" 2>&1 | tee "$$EVIDENCE/docker-pull.log"
        docker image inspect "$$IMAGE" > "$$EVIDENCE/image-inspect.json"
        docker run --rm --gpus all --ipc=host \
          -e CUDA_VISIBLE_DEVICES=$gpu_device_ids \
          -e NEPTUNE_REV="$$NEPTUNE_REV" \
          -v "$$EVIDENCE:/results" \
          -v "$$SOURCE/run.sh:/experiment/run.sh:ro" \
          -v "$$SOURCE/run_neptune.py:/experiment/run_neptune.py:ro" \
          -v "$$EXPERIMENT/tuning_a10080.tar.gz:/experiment/tuning_a10080.tar.gz:ro" \
          "$$IMAGE" bash /experiment/run.sh "$operator" /experiment/tuning_a10080.tar.gz \
          2>&1 | tee "$$EVIDENCE/container.log"
        ;;
      pytorch)
        cd $repo_dir
        if ! dpkg -s python3.12-dev python3.12-venv >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y python3.12-dev python3.12-venv
        fi
        if [ ! -x venv/bin/pip ]; then
          python3.12 -m venv venv --prompt emmy
        fi
        if ! venv/bin/python -c 'import torch, sys; sys.exit(torch.__version__.split("+")[0] != "2.13.0")' 2>/dev/null; then
          venv/bin/pip install torch==2.13.0 2>&1 | tee "$$EVIDENCE/pytorch-install.log"
        fi
        test "$$(venv/bin/python -c 'import torch; print(torch.__version__.split("+")[0])')" = "2.13.0"
        export CUDA_VISIBLE_DEVICES=$gpu_device_ids
        venv/bin/python -c 'import torch; print(f"torch={torch.__version__}"); \
          print(f"cuda={torch.version.cuda}"); print(f"gpu={torch.cuda.get_device_name(0)}")' \
          > "$$EVIDENCE/pytorch-environment.txt"
        nvidia-smi -q > "$$EVIDENCE/pytorch-nvidia-smi.txt"
        sha256sum "$$SOURCE/run_pytorch.py" > "$$EVIDENCE/pytorch-input.sha256"
        mkdir -p "$$EVIDENCE/json"
        for sequence in 256 512 1024 2048 4096 8192 16384 32768; do
          for repetition in 1 2; do
            venv/bin/python "$$SOURCE/run_pytorch.py" "$operator" "$$sequence" \
              --warmup 1 --iters 15 \
              --json "$$EVIDENCE/json/$operator-b1-s$$sequence-r$$repetition.json"
          done
        done
        ;;
      *)
        echo "unknown lane: $lane" >&2
        exit 2
        ;;
    esac
  result_files:
    - artifacts.tar.gz
  timeout: 28800

matrices:
  - deploy.gpu: "NVIDIA A100 40GB"
    deploy.gpu_count: 1
    lane: neptune
    operator:
      - prefill_global
      - prefill_causal
      - prefill_gqa
      - decode_causal
      - decode_gqa
      - prefill_alibi
      - decode_alibi
      - prefill_softcap
      - decode_softcap
      - prefill_windowed
  - deploy.gpu: "NVIDIA A100 40GB"
    deploy.gpu_count: 1
    lane: pytorch
    operator:
      - prefill_global
      - prefill_causal
      - prefill_gqa
      - decode_causal
      - decode_gqa
