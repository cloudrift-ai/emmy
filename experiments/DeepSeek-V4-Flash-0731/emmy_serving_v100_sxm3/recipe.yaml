# The serving workload of recipes/DeepSeek-V4-Flash-0731 on 16x V100 SXM3 32GB: the Emmy serving image at the
# recipe's exact envelope (context 1,048,576, memory share 0.80, reasoning and tool-call parsers, prefix cache on).
#
# Two points, the ones the A/B against the plain fork measures (../emmy_ab_v100_sxm3): one request at a time with
# 2,048 input tokens, and eight concurrent requests with 1,024. Every prompt is random and shares nothing, so the
# prefix cache has nothing to serve, with one exception the client makes: its warm-up sends the first prompt, which is
# then a full cache hit when it is measured. That is one prompt in 8 at the first point and one in 32 at the second,
# so the first point is read by its median.
model:
  huggingface: "deepseek-ai/DeepSeek-V4-Flash-0731"
  revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
  task: generate

engine:
  llm:
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    gpu_memory_utilization: 0.80
    context_length: 1048576
    max_concurrent_requests: 8
    vllm:
      image: "cloudriftai/vllm-emmy-deepseek-v4-flash-0731:1.2.3-992de5c8"
      extra_args: >-
        --dtype half
        --hf-overrides '{"architectures":["EmmyGenModel"]}'
        --distributed-executor-backend mp
        --kv-cache-dtype fp8
        --block-size 256
        --max-num-batched-tokens 4112
        --tokenizer-mode deepseek_v4
        --reasoning-parser deepseek_v4
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --enable-prefix-caching
      extra_env:
        VLLM_SM70_FLASH_ATTN_V100: "1"
        VLLM_SM70_FP8_TURBOMIND: "1"
        VLLM_SM70_MXFP4_TURBOMIND: "1"
        VLLM_SM70_MXFP4_TUNE_SMALL_SHAPES: "0"
        VLLM_SM70_QUANT_BACKEND: "turbomind"

benchmark:
  seed: 731
  temperature: 0.0
  ignore_eos: true
  repeats: 3

matrices:
  - deploy.gpu: "NVIDIA Tesla V100 SXM3 32GB"
    deploy.gpu_count: 16
    zip:
      benchmark.random_input_len: [2048, 1024]
      benchmark.random_output_len: [128, 64]
      benchmark.max_concurrency: [1, 8]
      benchmark.num_prompts: [8, 32]
      benchmark.num_warmups: [2, 8]
