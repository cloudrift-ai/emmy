# The Emmy serving image for DeepSeek V4 Flash 0731 on 16x V100 SXM3 32GB, as one variant: the publication input of
# `emmy publish`, and the deployable form of the Emmy arm in ../emmy_ab_v100_sxm3, which holds its measurements.
#
# The maintained recipe (recipes/DeepSeek-V4-Flash-0731) keeps the plain 1Cat fork image at the full 1M context, and
# the catalog holds one recipe per model, so this image's recipe lives here. The image is built FROM the fork's digest
# by docker/vllm-emmy-serve (models/deepseek-v4-flash-0731.env) and serves the envelope it was warmed at: context
# 4,096 and 4,112 batched tokens. A different context length or batched-token limit would miss its packs.
#
# The workload is the A/B's 8-concurrent point at seed 731, with prefix caching off as there.
model:
  huggingface: "deepseek-ai/DeepSeek-V4-Flash-0731"
  revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
  task: generate

engine:
  llm:
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    gpu_memory_utilization: 0.90
    context_length: 4096
    max_concurrent_requests: 8
    vllm:
      image: "cloudriftai/vllm-emmy-deepseek-v4-flash-0731:1.2.3-992de5c8"
      extra_args: >-
        --dtype half
        --distributed-executor-backend mp
        --kv-cache-dtype fp8
        --block-size 256
        --max-num-batched-tokens 4112
        --tokenizer-mode deepseek_v4
        --no-enable-prefix-caching
      extra_env:
        VLLM_SM70_FP8_TURBOMIND: "1"
        VLLM_SM70_MXFP4_TURBOMIND: "1"
        VLLM_SM70_MXFP4_TUNE_SMALL_SHAPES: "0"
        VLLM_SM70_QUANT_BACKEND: "turbomind"

benchmark:
  max_concurrency: 8
  num_prompts: 8
  random_input_len: 1024
  random_output_len: 64
  seed: 731
  temperature: 0.0
  ignore_eos: true
  num_warmups: 8
  repeats: 3

matrices:
  deploy.gpu: "NVIDIA Tesla V100 SXM3 32GB"
  deploy.gpu_count: 16
