# Hardware counters for the exact register schedule measured by gdn_register.
command:
  stage:
    - emmy
    - pyproject.toml
    - experiments/Qwen3.8-27B/gdn_kernels/chunk_state.py
  strict: true
  run: |
    set -uo pipefail
    mkdir -p $task_dir/artifacts
    cd $repo_dir
    code=$$(cat experiments/Qwen3.8-27B/gdn_kernels/chunk_state.py)
    devices="$gpu_device_ids"
    sudo -n env PATH=/usr/local/cuda/bin:/usr/bin:/bin \
      LD_PRELOAD=/usr/local/cuda-12.9/lib64/libnvrtc.so.12 PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 \
      CUDA_VISIBLE_DEVICES=$${devices%%,*} PYTHONPATH=$repo_dir \
      GDN_HEADS="$heads" GDN_TOKENS="$tokens" \
      EMMY_GOLDEN_FILE= EMMY_NVCC_FLAGS= EMMY_STAGE=d1/reg EMMY_WORK=w2x1 \
      EMMY_TILE=mma_m8n8k4_f16_$acc/f1x8/k4 EMMY_BENCH_COMPILE_TIMEOUT_S=90 \
      EMMY_TUNE_DB=$task_dir/autotune.db EMMY_ONLINE_FILE=$task_dir/online.json \
      timeout -k 3s 110s "$ncu" \
      --target-processes all --kernel-name "regex:$kernel" --launch-skip 2 --launch-count "$launches" \
      --cache-control none --clock-control none \
      --section SpeedOfLight --section LaunchStats --section Occupancy --section SchedulerStats \
      --section WarpStateStats --section ComputeWorkloadAnalysis --section MemoryWorkloadAnalysis \
      --section InstructionStats --section SourceCounters \
      --export $task_dir/artifacts/profile --log-file $task_dir/artifacts/profiler.log \
      "$python" -m emmy.emmy run --code "$$code" \
      --bench --strict --bench-backends eager,emmy --warmup 2 --iters 3 --no-record-nodes \
      --json $task_dir/artifacts/measurement.json \
      > $task_dir/artifacts/measurement.log 2>&1
    status=$$?
    printf '%s\n' "$$status" > $task_dir/artifacts/status.txt
    if test -f $task_dir/artifacts/profile.ncu-rep; then
      "$ncu" --import $task_dir/artifacts/profile.ncu-rep --page raw --csv \
        > $task_dir/artifacts/counters.csv
      "$ncu" --import $task_dir/artifacts/profile.ncu-rep --page details \
        > $task_dir/artifacts/details.txt
      "$ncu" --import $task_dir/artifacts/profile.ncu-rep --page raw --csv --print-metric-instances values \
        > $task_dir/artifacts/counter_instances.csv
    fi
    "$ncu" --version > $task_dir/artifacts/profiler_version.txt
    "$python" -m pip freeze --all > $task_dir/artifacts/requirements.freeze.txt
    tar -C $task_dir -czf $task_dir/artifacts.tar.gz artifacts
    exit "$$status"
  result_files:
    - artifacts.tar.gz
  timeout: 120

matrices:
  - cross:
      acc: [f32, f16]
      heads: [12, 48]
      tokens: 128
      kernel: k_matmul_reduce
      launches: 1
      deploy.gpu: NVIDIA Tesla V100 SXM2 16GB
      deploy.gpu_count: 1
      python: /home/riftuser/emmy/venv/bin/python
      ncu: /opt/nvidia/nsight-compute/2025.2.1/ncu
  - cross:
      acc: [f32, f16]
      heads: 12
      tokens: 512
      kernel: k_matmul_reduce
      launches: 1
      deploy.gpu: NVIDIA Tesla V100 SXM2 16GB
      deploy.gpu_count: 1
      python: /home/riftuser/emmy/venv/bin/python
      ncu: /opt/nvidia/nsight-compute/2025.2.1/ncu
  - cross:
      acc: f32
      heads: 12
      tokens: 128
      kernel: .*gemm.*
      launches: 2
      deploy.gpu: NVIDIA Tesla V100 SXM2 16GB
      deploy.gpu_count: 1
      python: /home/riftuser/emmy/venv/bin/python
      ncu: /opt/nvidia/nsight-compute/2025.2.1/ncu
