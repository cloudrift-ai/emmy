# Paged KV cache on the native Qwen3-0.6B generation and serving path, on a V100.
#
# The cache is always a table of pages the Rust runtime owns; `page_tokens` says how many tokens
# one page holds. A page spanning the whole context is one page, which addresses exactly like the
# single contiguous array it replaces — that row is the control. Every other row must generate the
# same tokens, because only the addressing differs.
#
# The schedules come from `golden/v100_sm70.json`, recorded on this card by `emmy run --golden
# --record-greedy --strict` under the 4080 experiment's cuts (native_manual_schedules): every fork is
# decided by a measured row, so the export runs under --strict-evidence with no other evidence in
# scope and an empty tuning database. The golden holds rows for the one-row fragments only, so the
# prompt is consumed one token per step (--prefill-size 1); the chunked prefill's fragments have no
# rows on this card yet.
command:
  stage: [emmy, pyproject.toml, Cargo.toml, Cargo.lock, crates, experiments/Qwen3-0.6B/paged_cache/golden]
  run: |
    set -eu
    cd $repo_dir
    export PATH=$repo_dir/target/release:$repo_dir/venv/bin:/usr/local/cuda/bin:$$PATH
    export CUDA_VISIBLE_DEVICES=$gpu_device_ids
    export EMMY_GOLDEN_FILE=
    export EMMY_TUNE_DB=$task_dir/autotune.db
    export EMMY_FAST_MATH=0
    export EMMY_NVCC_FLAGS=
    golden=$repo_dir/experiments/Qwen3-0.6B/paged_cache/golden/$golden
    cargo build --release --locked --workspace
    rustc --version > $task_dir/toolchain.txt
    ./venv/bin/emmy generate $hf_model \
      --export-native $task_dir/pack \
      --context-length $context_length \
      --page-tokens $page_tokens --prefill-size 1 \
      --golden $$golden --strict-evidence \
      2>&1 | tee $task_dir/export.log
    ./venv/bin/emmy generate $hf_model \
      --native-pack $task_dir/pack \
      --prompt "$prompt" \
      --max-new-tokens $max_new_tokens \
      2>&1 | tee $task_dir/generate.log
    ./venv/bin/python -c "
    import json, pathlib
    pack = json.loads(pathlib.Path('$task_dir/pack/plan/decode.json').read_text())
    paged = {n: p for n, p in pack.get('paged', {}).items()}
    pathlib.Path('$task_dir/cache.json').write_text(json.dumps({
        'page_tokens': $page_tokens,
        'context_length': $context_length,
        'paged_buffers': len(paged),
        'pages_per_buffer': $context_length // $page_tokens,
    }, indent=2))
    "
    # The same pack shape served over HTTP: prepare with the same page size and golden, then one
    # chat request and one streamed completion through the Rust server.
    ./venv/bin/emmy serve $hf_model --runner generate --native --golden $$golden --strict-evidence \
      --max-model-len $context_length --page-tokens $page_tokens --prefill-size 1 \
      --host 127.0.0.1 --port $port > $task_dir/serve.log 2>&1 &
    server=$$!
    trap 'kill -INT $$server 2>/dev/null || true; wait $$server 2>/dev/null || true' EXIT
    for attempt in $$(seq 1 300); do
      curl -sf http://127.0.0.1:$port/health > /dev/null && break
      kill -0 $$server 2>/dev/null || exit 1
      sleep 2
    done
    curl -fsS http://127.0.0.1:$port/v1/chat/completions -H 'Content-Type: application/json' \
      --data "{\"model\":\"$hf_model\",\"messages\":[{\"role\":\"user\",\"content\":\"$prompt\"}],\"max_tokens\":16}" \
      > $task_dir/chat.json
    curl -fsSN http://127.0.0.1:$port/v1/completions -H 'Content-Type: application/json' \
      --data "{\"model\":\"$hf_model\",\"prompt\":\"$prompt\",\"max_tokens\":32,\"stream\":true,\"stream_options\":{\"include_usage\":true}}" \
      > $task_dir/stream.txt
  result_files:
    - "*.log"
    - "*.json"
    - "*.txt"
  timeout: 3600

matrices:
  cross:
    deploy.gpu_count: 1
    deploy.gpu:
      - "NVIDIA Tesla V100 SXM2 16GB"
    hf_model: "Qwen/Qwen3-0.6B"
    golden: v100_sm70.json
    context_length: 256
    # The control is one page spanning the context; the others cut it into many.
    page_tokens: [256, 64, 16]
    prompt: "The capital of France is"
    max_new_tokens: 8
    port: 8128
