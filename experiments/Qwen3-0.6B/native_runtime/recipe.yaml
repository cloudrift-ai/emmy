# Static RMSNorm programs at Qwen3-0.6B's hidden width; this is not full-model generation.
command:
  stage: [emmy, pyproject.toml, Cargo.toml, Cargo.lock, crates]
  run: |
    set -eu
    cd $repo_dir
    export PATH=$repo_dir/target/release:$repo_dir/venv/bin:/usr/local/cuda/bin:$$PATH
    export CUDA_VISIBLE_DEVICES=$gpu_device_ids
    export EMMY_NVCC_FLAGS=
    export EMMY_GOLDEN_FILE=
    export EMMY_TUNE_DB=$task_dir/autotune.db
    export EMMY_ONLINE_FILE=$task_dir/online.json
    ./venv/bin/python - <<'PY'
    from pathlib import Path
    import numpy as np
    from emmy.compiler.backend.pack import save_executable
    from emmy.compiler.backend.plan import plan_from_graph
    from emmy.compiler.dtype import F16
    from emmy.compiler.graph import Graph, Tensor
    from emmy.compiler.ir.base import InputOp
    from emmy.compiler.ir.frontend.ir import RmsNormOp
    from emmy.compiler.pipeline import CUDA_PASSES, Pipeline
    graph = Graph()
    graph.add_node(InputOp(), [], Tensor("x", ($rows, 1024), F16), node_id="x")
    graph.add_node(InputOp(), [], Tensor("w", (1024,), F16), node_id="w")
    graph.add_node(RmsNormOp(eps=1e-6), ["x", "w"], Tensor("y", ($rows, 1024), F16), node_id="y")
    graph.inputs, graph.outputs = ["x", "w"], ["y"]
    plan = plan_from_graph(Pipeline.build(CUDA_PASSES).run(graph))
    arrays = {"x": np.random.default_rng(0).standard_normal(($rows, 1024)).astype(np.float16), "w": np.ones(1024, np.float16)}
    for buffer in plan.buffers:
        if buffer.name in plan.constants:
            arrays[buffer.name] = np.full(buffer.resolve_shape({}), plan.constants[buffer.name], dtype=buffer.dtype.np)
    save_executable(Path("$task_dir") / "pack", {"rms_norm": plan}, bindings={"rms_norm": {k: v.tobytes() for k, v in arrays.items()}}, key={"rows": $rows, "width": 1024, "seed": 0})
    PY
    ./venv/bin/emmy run --pack $task_dir/pack --bench --warmup 20 --iters 200 --json $task_dir/runtime.json
  result_files: ["runtime.json", "pack/manifest.json", "pack/plan/*.json", "pack/bindings/*", "pack/cubin/*"]
  timeout: 120
matrices:
  cross:
    deploy.gpu: "NVIDIA GeForce RTX 4080"
    deploy.gpu_count: 1
    rows: [1, 16, 256]
