[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "emmy-runtime"
version = "0.1.0"
description = "In-process CUDA executor for Emmy's compiled programs"
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.maturin]
module-name = "emmy_runtime"
manifest-path = "Cargo.toml"
