[package]
name = "emmy-runtime-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "emmy_runtime"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
emmy-runtime = { path = "../emmy-runtime" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }
serde_json = "1"
